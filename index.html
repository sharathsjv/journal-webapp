<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Notice</title>
<meta name="theme-color" content="#EEF0E7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Notice" />
<link rel="apple-touch-icon" href="icon-512.png" />
<link rel="icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<style>
  :root{
    --ink:#31352A; --ink-soft:#6B7160; --bg:#EEF0E7; --line:#DEE1D3;
    --accent:#6B7A54; --accent-soft:#98A382; --surface:#F8F9F3;
    --serif: "Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); overscroll-behavior-y:none; font-weight:300;}
  #bg{position:fixed; inset:0; overflow:hidden; z-index:0;}
  .blob{position:absolute; border-radius:50%; opacity:.38; filter:blur(60px);}
  #app{max-width:460px; margin:0 auto; min-height:100vh; position:relative; z-index:1; display:flex; flex-direction:column; align-items:center;}
  textarea::placeholder{color:var(--accent-soft); opacity:.7; font-weight:300;}
  textarea{caret-color:var(--accent);}
  button{font-family:var(--sans); cursor:pointer;}

  .screen{width:100%; display:none; flex-direction:column; align-items:center;}
  .screen.active{display:flex;}
  #write{min-height:100vh; justify-content:center; padding:24px 26px 130px;}
  #reflect{padding:56px 26px 130px;}

  h1.title{font-family:var(--serif); font-weight:300; font-size:26px; margin:0 0 28px; letter-spacing:.005em;}

  .empty{border:1px dashed var(--line); border-radius:14px; padding:28px 20px; text-align:center; width:100%;}
  .empty .h{font-family:var(--serif); font-weight:300; font-size:18px; margin-bottom:6px;}
  .empty .p{font-family:var(--sans); font-weight:300; font-size:14px; color:var(--ink-soft);}

  .entry{border-bottom:1px solid var(--line); width:100%;}
  .entry-head{width:100%; background:none; border:none; padding:16px 2px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; text-align:left;}
  .entry-date{font-family:var(--sans); font-weight:400; font-size:12px; color:var(--accent-soft); margin-bottom:4px;}
  .entry-happened{font-family:var(--serif); font-weight:300; font-size:18px; line-height:1.42; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;}
  .entry-happened.expanded{-webkit-line-clamp:unset;}
  .chev{flex-shrink:0; margin-top:6px; transition:transform 220ms ease; color:var(--ink-soft);}
  .chev.rot{transform:rotate(180deg);}
  .entry-body{max-height:0; overflow:hidden; transition:max-height 280ms ease;}
  .entry-body.open{max-height:400px;}
  .entry-body-inner{padding:0 2px 20px; display:flex; flex-direction:column; gap:16px;}
  .label{font-family:var(--sans); font-size:12px; color:var(--accent-soft); margin-bottom:4px;}
  .val{font-family:var(--sans); font-weight:300; font-size:15.5px; line-height:1.6;}

  .date-heading{font-family:var(--sans); font-weight:400; font-size:13px; color:var(--accent); margin:22px 0 4px; letter-spacing:.01em;}

  .dots{display:flex; gap:8px; justify-content:center; margin-bottom:26px;}
  .dot{width:6px; height:6px; border-radius:999px; border:1px solid var(--line); transition:background 220ms ease, border-color 220ms ease;}
  .dot.on{background:var(--accent); border-color:var(--accent);}

  #stepWrap{width:100%; display:flex; flex-direction:column; align-items:center; transition:opacity 260ms ease;}
  .prompt{font-family:var(--serif); font-weight:300; font-size:30px; line-height:1.32; margin:0 0 22px; letter-spacing:.005em; text-align:center;}
  .field{font-family:var(--sans); font-weight:300; font-size:17px; line-height:1.6; color:var(--ink); background:transparent; border:none; border-bottom:1px solid var(--line); outline:none; resize:none; padding:4px 2px 14px; width:100%; text-align:center;}

  .next-btn{margin-top:26px; display:flex; align-items:center; gap:8px; border-radius:999px; padding:12px 24px; font-size:14.5px; font-weight:400; letter-spacing:.01em; border:1px solid var(--line); background:transparent; color:var(--ink-soft);}
  .next-btn.ready{background:var(--accent); color:var(--surface); border:none;}

  .tabbar{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:6px; background:rgba(248,249,243,0.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:999px; padding:5px; z-index:2; box-shadow:0 8px 24px rgba(49,53,42,0.10);}
  .tab-btn{display:flex; align-items:center; gap:7px; border:none; border-radius:999px; padding:10px 18px; background:transparent; color:var(--ink-soft); font-size:14px; font-weight:400; letter-spacing:.01em;}
  .tab-btn.active{background:var(--accent); color:var(--surface);}

  .view-toggle{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px; margin-bottom:22px;}
  .view-btn{border:none; border-radius:999px; padding:7px 16px; background:transparent; color:var(--ink-soft); font-size:13px; font-weight:400;}
  .view-btn.active{background:var(--accent); color:var(--surface);}

  .table-wrap{width:100%; overflow-x:auto; border:1px solid var(--line); border-radius:10px;}
  table{border-collapse:collapse; width:100%; min-width:560px;}
  th{text-align:left; font-family:var(--sans); font-weight:400; font-size:12.5px; color:var(--accent-soft); padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{font-family:var(--sans); font-weight:300; font-size:13.5px; color:var(--ink); padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top;}

  .loading-more{padding:18px 0; text-align:center; font-family:var(--sans); font-size:12.5px; color:var(--accent-soft); width:100%;}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">

  <div id="write" class="screen active">
    <div class="dots" id="dots"></div>
    <div id="stepWrap">
      <h1 class="prompt" id="promptText"></h1>
      <textarea class="field" id="fieldInput" rows="6"></textarea>
    </div>
    <button class="next-btn" id="nextBtn" onclick="stepNext()">
      <span id="nextLabel">Continue</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>

  <div id="reflect" class="screen">
    <h1 class="title">Reflect</h1>
    <div id="reflectBody" style="width:100%;"></div>
  </div>

  <div class="tabbar">
    <button class="tab-btn active" id="tabWriteBtn" onclick="switchTab('write')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>
      Write
    </button>
    <button class="tab-btn" id="tabReflectBtn" onclick="switchTab('reflect')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.5 0 2.5 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.5 0 2.5 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.5 0 2.5 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>
      Reflect
    </button>
  </div>

</div>

<script>
  const STORAGE_KEY = "notice-entries";
  const PAGE_SIZE = 20;
  const STEPS = [
    { key: "happened", prompt: "What happened?", placeholder: "Start wherever it makes sense to start." },
    { key: "thought", prompt: "What do you make of it?", placeholder: "The story you're telling yourself about it." },
    { key: "feeling", prompt: "What are you feeling?", placeholder: "Name it, even roughly." }
  ];
  const BLOB_PALETTE = ["#C9D2B4", "#D9C9B0", "#B9C7BE", "#CBB9C2", "#D4CDA8"];

  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]").sort((a,b)=>b.ts-a.ts);
  let step = 0;
  let form = {};
  let expandedId = null;
  let pendingLocation = null;
  let currentTab = "write";
  let currentView = "timeline";
  let visibleCount = PAGE_SIZE;
  let io = null;

  function seededBlobs(){
    let seed = 42;
    const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const bgEl = document.getElementById("bg");
    let styleTag = "";
    for (let i = 0; i < 5; i++){
      const size = 260 + rand() * 220;
      const top = rand() * 90;
      const left = rand() * 90;
      const duration = 34 + rand() * 26;
      const delay = -rand() * 30;
      const driftX = 30 + rand() * 40;
      const driftY = 20 + rand() * 30;
      const div = document.createElement("div");
      div.className = "blob";
      div.style.top = top + "%";
      div.style.left = left + "%";
      div.style.width = size + "px";
      div.style.height = size + "px";
      div.style.background = BLOB_PALETTE[i % BLOB_PALETTE.length];
      div.style.animation = `driftBlob${i} ${duration}s ease-in-out ${delay}s infinite`;
      bgEl.appendChild(div);
      styleTag += `@keyframes driftBlob${i} {
        0% { transform: translate(0px,0px) scale(1); }
        33% { transform: translate(${driftX}px, -${driftY}px) scale(1.08); }
        66% { transform: translate(-${driftX*0.7}px, ${driftY}px) scale(0.95); }
        100% { transform: translate(0px,0px) scale(1); }
      }\n`;
    }
    const styleEl = document.createElement("style");
    styleEl.textContent = styleTag;
    document.head.appendChild(styleEl);
  }

  function getLocation(){
    return new Promise((resolve) => {
      if (!navigator.geolocation){ resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude } = pos.coords;
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=10`);
            const data = await res.json();
            const a = data.address || {};
            const label = a.city || a.town || a.village || a.suburb || a.county || null;
            const country = a.country || null;
            const parts = [label, country].filter(Boolean);
            resolve({ lat: latitude, lon: longitude, label: parts.length ? parts.join(", ") : null });
          } catch(e){
            resolve({ lat: latitude, lon: longitude, label: null });
          }
        },
        () => resolve(null),
        { timeout: 6000 }
      );
    });
  }

  function timeOnly(ts){
    return new Date(ts).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
  }

  function timeAgo(ts){
    const d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()){
      return d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
    }
    return d.toLocaleDateString(undefined, {month:"short", day:"numeric", year: d.getFullYear()!==now.getFullYear() ? "numeric": undefined});
  }

  function dateHeading(ts){
    const d = new Date(ts), now = new Date();
    const y = new Date(now); y.setDate(now.getDate()-1);
    if (d.toDateString() === now.toDateString()) return "Today";
    if (d.toDateString() === y.toDateString()) return "Yesterday";
    return d.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric", year: d.getFullYear()!==now.getFullYear() ? "numeric": undefined});
  }

  function truncate(s, n){
    if (!s) return "—";
    return s.length > n ? s.slice(0, n).trim() + "…" : s;
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function setupInfiniteScroll(totalCount){
    if (io) { io.disconnect(); io = null; }
    const sentinel = document.getElementById("scrollSentinel");
    if (!sentinel || visibleCount >= totalCount) return;
    io = new IntersectionObserver((es) => {
      if (es[0].isIntersecting){
        visibleCount = Math.min(visibleCount + PAGE_SIZE, totalCount);
        renderReflect();
      }
    }, { rootMargin: "200px" });
    io.observe(sentinel);
  }

  function renderReflect(){
    const body = document.getElementById("reflectBody");
    if (entries.length === 0){
      body.innerHTML = `<div class="empty"><div class="h">Nothing here yet</div><div class="p">Write something, then come back.</div></div>`;
      return;
    }

    const toggleHtml = `
      <div class="view-toggle">
        <button class="view-btn ${currentView==='timeline'?'active':''}" onclick="setView('timeline')">Timeline</button>
        <button class="view-btn ${currentView==='table'?'active':''}" onclick="setView('table')">Table</button>
      </div>`;

    const visible = entries.slice(0, visibleCount);
    let contentHtml = "";

    if (currentView === "timeline"){
      let lastKey = null;
      visible.forEach((e) => {
        const key = new Date(e.ts).toDateString();
        if (key !== lastKey){
          contentHtml += `<div class="date-heading">${dateHeading(e.ts)}</div>`;
          lastKey = key;
        }
        const open = expandedId === e.id;
        contentHtml += `
          <div class="entry">
            <button class="entry-head" onclick="toggleEntry('${e.id}')">
              <div style="min-width:0; flex:1;">
                <div class="entry-date">${timeOnly(e.ts)}${e.location && e.location.label ? ' · ' + escapeHtml(e.location.label) : ''}</div>
                <div class="entry-happened ${open?'expanded':''}">${escapeHtml(e.happened)}</div>
              </div>
              <svg class="chev ${open?'rot':''}" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="entry-body ${open?'open':''}">
              <div class="entry-body-inner">
                <div><div class="label">Thought</div><div class="val">${escapeHtml(e.thought)}</div></div>
                <div><div class="label">Feeling</div><div class="val">${escapeHtml(e.feeling)}</div></div>
              </div>
            </div>
          </div>`;
      });
    } else {
      let rows = "";
      visible.forEach((e) => {
        rows += `
          <tr>
            <td>${timeAgo(e.ts)}</td>
            <td>${escapeHtml(truncate(e.location && e.location.label, 22))}</td>
            <td>${escapeHtml(truncate(e.happened, 50))}</td>
            <td>${escapeHtml(truncate(e.thought, 50))}</td>
            <td>${escapeHtml(truncate(e.feeling, 50))}</td>
          </tr>`;
      });
      contentHtml = `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Time</th><th>Place</th><th>Situation</th><th>Thought</th><th>Feeling</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    const moreHtml = visibleCount < entries.length
      ? `<div class="loading-more" id="scrollSentinel">Loading more…</div>`
      : "";

    body.innerHTML = toggleHtml + contentHtml + moreHtml;
    setupInfiniteScroll(entries.length);
  }

  window.setView = function(v){
    currentView = v;
    visibleCount = PAGE_SIZE;
    renderReflect();
  }

  window.toggleEntry = function(id){
    expandedId = expandedId === id ? null : id;
    renderReflect();
  }

  window.switchTab = function(tab){
    currentTab = tab;
    document.getElementById("write").classList.toggle("active", tab === "write");
    document.getElementById("reflect").classList.toggle("active", tab === "reflect");
    document.getElementById("tabWriteBtn").classList.toggle("active", tab === "write");
    document.getElementById("tabReflectBtn").classList.toggle("active", tab === "reflect");
    if (tab === "reflect"){
      visibleCount = PAGE_SIZE;
      renderReflect();
    }
  }

  function renderDots(){
    document.getElementById("dots").innerHTML = STEPS.map((s,i) =>
      `<div class="dot ${i<=step?'on':''}"></div>`).join("");
  }

  function renderStep(fade){
    renderDots();
    const wrap = document.getElementById("stepWrap");
    const doRender = () => {
      const s = STEPS[step];
      document.getElementById("promptText").textContent = s.prompt;
      const field = document.getElementById("fieldInput");
      field.placeholder = s.placeholder;
      field.value = form[s.key] || "";
      updateNextBtn();
      if (fade) {
        wrap.style.opacity = 1;
        setTimeout(() => field.focus(), 100);
      }
    };
    if (fade){
      wrap.style.opacity = 0;
      setTimeout(doRender, 260);
    } else {
      doRender();
    }
  }

  function updateNextBtn(){
    const val = document.getElementById("fieldInput").value.trim();
    const btn = document.getElementById("nextBtn");
    const ready = val.length > 0;
    btn.classList.toggle("ready", ready);
    document.getElementById("nextLabel").textContent = step < STEPS.length - 1 ? "Continue" : "Save";
  }

  document.getElementById("fieldInput").addEventListener("input", updateNextBtn);

  window.stepNext = function(){
    const s = STEPS[step];
    const field = document.getElementById("fieldInput");
    const val = field.value.trim();
    if (!val) return;
    form[s.key] = field.value;
    if (step < STEPS.length - 1){
      step++;
      renderStep(true);
    } else {
      saveEntry(form);
    }
  }

  function saveEntry(f){
    const entry = { id: String(Date.now()), ts: Date.now(), location: pendingLocation, ...f };
    entries = [entry, ...entries];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    form = {};
    step = 0;
    renderStep(false);
    pendingLocation = null;
    getLocation().then(loc => { pendingLocation = loc; });
    visibleCount = PAGE_SIZE;
    switchTab("reflect");
  }

  seededBlobs();
  renderStep(false);
  getLocation().then(loc => { pendingLocation = loc; });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
