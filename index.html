<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Notice</title>
<meta name="theme-color" content="#EEF0E7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Notice" />
<link rel="apple-touch-icon" href="icon-512.png" />
<link rel="icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<style>
  :root{
    --ink:#31352A; --ink-soft:#6B7160; --bg:#EEF0E7; --line:#DEE1D3;
    --line-strong:#B9C0A6; --accent:#6B7A54; --accent-soft:#98A382; --surface:#F8F9F3;
    --radius-lg:22px; --radius-md:16px; --radius-sm:12px;
    --serif: "Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    --glow1:#E4E8D6; --glow2:#E1E6D2; --blob-opacity:.5;
  }
  :root[data-theme="dark"]{
    --ink:#F1F1EE; --ink-soft:#8F8F89; --bg:#121212; --line:#292929;
    --line-strong:#3C3C3A; --accent:#EDEDE9; --accent-soft:#B4B4AC; --surface:#1C1C1A;
    --glow1:#1E1E1C; --glow2:#191917; --blob-opacity:.14;
  }
  :root[data-theme="dark"] .blob{ filter: blur(50px) grayscale(1); }
  html{ transition: background 220ms ease; }
  body, #bg, .task-card, .empty, #stepWrap, .filter-row, .photo-strip, .photo-grid, .table-wrap, .desc-input, .inline-add-input, .tabbar, .view-toggle, .theme-toggle { transition: background 220ms ease, border-color 220ms ease, color 220ms ease; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-weight:300; overflow-x:hidden; width:100%; -webkit-overflow-scrolling:touch;}
  #bg{position:fixed; inset:0; overflow:hidden; z-index:0; background:radial-gradient(circle at 18% 8%, var(--glow1) 0%, var(--bg) 46%), radial-gradient(circle at 86% 92%, var(--glow2) 0%, var(--bg) 52%);}
  .blob{position:absolute; border-radius:50%; opacity:var(--blob-opacity); filter:blur(50px);}
  .theme-toggle{position:fixed; top:max(18px, env(safe-area-inset-top)); right:18px; width:38px; height:38px; border-radius:50%; border:2px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; z-index:5;}
  #app{max-width:460px; margin:0 auto; min-height:100vh; position:relative; z-index:1; display:flex; flex-direction:column; align-items:center;}
  textarea::placeholder{color:var(--accent-soft); opacity:.7; font-weight:300;}
  textarea{caret-color:var(--accent);}
  button{font-family:var(--sans); cursor:pointer; color:inherit;}

  .screen{width:100%; display:none; flex-direction:column; align-items:center;}
  .screen.active{display:flex;}
  #journal{padding:56px 26px 130px;}
  .subview{width:100%; display:none; flex-direction:column; align-items:center;}
  .subview.active{display:flex;}
  #write{padding-top:10px;}
  #tasks{padding:56px 26px 130px;}
  .location-edit-btn{border:2px solid var(--line-strong); background:transparent; color:var(--ink-soft); width:30px; height:30px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0;}
  #locationRow{gap:8px;}
  .location-btn.locating{color:var(--accent-soft);}

  .eyebrow{font-family:var(--sans); font-weight:400; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-soft); margin-bottom:6px;}

  h1.title{font-family:var(--serif); font-weight:300; font-size:26px; margin:0 0 28px; letter-spacing:.005em;}

  .empty{border:2px dashed var(--line-strong); border-radius:var(--radius-lg); padding:28px 20px; text-align:center; width:100%;}
  .empty .h{font-family:var(--serif); font-weight:300; font-size:18px; margin-bottom:6px;}
  .empty .p{font-family:var(--sans); font-weight:300; font-size:14px; color:var(--ink-soft);}

  .entry{border-bottom:1px solid var(--line); width:100%;}
  .entry-head{width:100%; background:none; border:none; padding:16px 2px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; text-align:left; color:inherit;}
  .entry-date{font-family:var(--sans); font-weight:400; font-size:12px; color:var(--accent-soft); margin-bottom:4px;}
  .entry-happened{font-family:var(--serif); font-weight:300; font-size:18px; line-height:1.42; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;}
  .chev{flex-shrink:0; margin-top:6px; color:var(--ink-soft);}
  .label{font-family:var(--sans); font-size:12px; color:var(--accent-soft); margin-bottom:4px;}
  .val{font-family:var(--sans); font-weight:300; font-size:15.5px; line-height:1.6; white-space:pre-wrap;}

  .date-heading{font-family:var(--sans); font-weight:400; font-size:13px; color:var(--accent); margin:22px 0 4px; letter-spacing:.01em;}

  .dots{display:flex; gap:8px; justify-content:center; margin-bottom:20px;}
  .dot{width:6px; height:6px; border-radius:999px; border:1px solid var(--line); transition:background 220ms ease, border-color 220ms ease;}
  .dot.on{background:var(--accent); border-color:var(--accent);}

  #stepWrap{width:100%; display:flex; flex-direction:column; align-items:center; transition:opacity 260ms ease; border:2px solid var(--line-strong); border-radius:var(--radius-lg); padding:26px 20px; box-sizing:border-box;}
  .prompt{font-family:var(--serif); font-weight:300; font-size:30px; line-height:1.32; margin:0 0 22px; letter-spacing:.005em; text-align:center;}
  .field{font-family:var(--sans); font-weight:300; font-size:17px; line-height:1.6; color:var(--ink); background:transparent; border:none; border-bottom:1px solid var(--line); outline:none; resize:none; padding:4px 2px 14px; width:100%; text-align:center;}

  .next-btn{margin-top:26px; display:flex; align-items:center; gap:8px; border-radius:999px; padding:12px 24px; font-size:14.5px; font-weight:400; letter-spacing:.01em; border:2px solid var(--line-strong); background:transparent; color:var(--ink-soft);}
  .next-btn.ready{background:var(--accent); color:var(--surface); border:none;}

  .tabbar{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:6px; background:rgba(248,249,243,0.9); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:2px solid var(--line-strong); border-radius:999px; padding:5px; z-index:2; box-shadow:0 8px 24px rgba(49,53,42,0.14);}
  .tab-btn{display:flex; align-items:center; gap:7px; border:none; border-radius:999px; padding:10px 16px; background:transparent; color:var(--ink-soft); font-size:13.5px; font-weight:400; letter-spacing:.01em;}
  .tab-btn.active{background:var(--accent); color:var(--surface);}

  .view-toggle{display:flex; gap:4px; background:var(--surface); border:2px solid var(--line-strong); border-radius:999px; padding:4px; margin-bottom:22px;}
  .view-btn{border:none; border-radius:999px; padding:7px 16px; background:transparent; color:var(--ink-soft); font-size:13px; font-weight:400;}
  .view-btn.active{background:var(--accent); color:var(--surface);}

  .table-wrap{width:100%; border:2px solid var(--line-strong); border-radius:var(--radius-md); overflow:hidden;}
  table{border-collapse:collapse; width:100%; table-layout:fixed;}
  th{text-align:left; font-family:var(--sans); font-weight:400; font-size:11.5px; color:var(--accent-soft); padding:8px 6px; border-bottom:1px solid var(--line); overflow-wrap:break-word;}
  td{font-family:var(--sans); font-weight:300; font-size:12.5px; color:var(--ink); padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:break-word; word-break:break-word;}
  th:nth-child(1), td:nth-child(1){width:14%;}
  th:nth-child(2), td:nth-child(2){width:16%;}
  th:nth-child(3), td:nth-child(3){width:24%;}
  th:nth-child(4), td:nth-child(4){width:23%;}
  th:nth-child(5), td:nth-child(5){width:23%;}
  tr.row-tap{cursor:pointer;}

  .loading-more{padding:18px 0; text-align:center; font-family:var(--sans); font-size:12.5px; color:var(--accent-soft); width:100%;}

  #entryDetail{padding:56px 26px 130px;}
  #taskDetail{padding:56px 26px 130px;}
  .back-row{width:100%; display:flex; align-items:center; gap:10px; margin-bottom:24px;}
  .back-btn{border:none; background:transparent; color:var(--ink-soft); display:flex; align-items:center; padding:6px; flex-shrink:0;}
  .detail-happened{font-family:var(--serif); font-weight:300; font-size:20px; line-height:1.5; white-space:pre-wrap;}

  .location-row{width:100%; display:flex; justify-content:center; margin-bottom:14px;}
  .location-row .inline-add-row{max-width:300px;}
  .location-btn{border:none; background:transparent; color:var(--ink-soft); font-family:var(--sans); font-size:12.5px; display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; border:2px solid var(--line-strong);}

  .photo-strip{display:flex; gap:8px; overflow-x:auto; width:100%; margin-bottom:20px; padding:10px; border:2px solid var(--line-strong); border-radius:var(--radius-lg); box-sizing:border-box; touch-action:pan-x;}
  .thumb-sm{position:relative; width:60px; height:60px; border-radius:var(--radius-sm); overflow:hidden; background:var(--line); flex-shrink:0; border:2px solid var(--line-strong);}
  .thumb-sm img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb-remove{position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(49,53,42,0.65); color:#fff; border:none; font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}
  .thumb-add{width:60px; height:60px; border-radius:var(--radius-sm); border:2px dashed var(--line-strong); display:flex; align-items:center; justify-content:center; color:var(--accent-soft); font-size:20px; flex-shrink:0; background:transparent;}

  .photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; border:2px solid var(--line-strong); border-radius:var(--radius-lg); padding:10px; box-sizing:border-box;}
  .photo-tile{position:relative; width:100%; aspect-ratio:1/1; border-radius:var(--radius-md); overflow:hidden; background:var(--line); border:2px solid var(--line-strong);}
  .photo-tile img{width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;}
  .photo-add-tile{aspect-ratio:1/1; border:2px dashed var(--line-strong); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; color:var(--accent-soft); font-size:24px; background:transparent;}

  .lightbox{position:fixed; inset:0; background:rgba(20,22,16,0.92); z-index:50; display:flex; align-items:center; justify-content:center; padding:24px;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:var(--radius-lg);}

  .filter-row{display:flex; gap:8px; overflow-x:auto; width:100%; margin-bottom:18px; padding:10px; border:2px solid var(--line-strong); border-radius:var(--radius-lg); box-sizing:border-box; touch-action:pan-x;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{flex-shrink:0; border:2px solid var(--line-strong); background:transparent; color:var(--ink-soft); border-radius:999px; padding:7px 14px; font-size:12.5px; font-family:var(--sans); white-space:nowrap;}
  .filter-chip.active{background:var(--accent); color:var(--surface); border-color:var(--accent);}

  .color-swatch{width:20px; height:20px; border-radius:50%; border:2px solid var(--line-strong); padding:0; flex-shrink:0; background:transparent; box-shadow:inset 0 0 0 2px var(--surface);}

  .deadline-input{font-family:var(--sans); font-weight:300; font-size:12.5px; color:var(--ink); background:var(--bg); border:2px solid var(--line-strong); border-radius:999px; padding:7px 10px; flex-shrink:0; outline:none;}
  .deadline-input.overdue{border-color:#C4694A; color:#C4694A;}
  .task-deadline{font-family:var(--sans); font-weight:400; font-size:12.5px; margin:-4px 0 8px;}
  .subtasks-box{width:100%; border:2px solid var(--line-strong); border-radius:var(--radius-lg); padding:14px; box-sizing:border-box;}

  .add-btn{width:100%; border:2px dashed var(--line-strong); border-radius:var(--radius-lg); padding:14px; text-align:center; color:var(--ink-soft); background:transparent; font-family:var(--sans); font-size:14px; margin-bottom:18px;}
  .add-btn-wrap{width:100%; margin-bottom:18px;}
  .inline-add-row{width:100%; display:flex; align-items:center; gap:8px;}
  .inline-add-input{flex:1; min-width:0; font-family:var(--sans); font-weight:300; font-size:14.5px; color:var(--ink); background:var(--surface); border:2px solid var(--accent-soft); border-radius:var(--radius-md); padding:12px 14px; outline:none;}
  .inline-add-input::placeholder{color:var(--accent-soft); opacity:.8;}
  .inline-add-icon{flex-shrink:0; width:38px; height:38px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; padding:0;}
  .inline-add-confirm{background:var(--accent); color:var(--surface);}
  .inline-add-cancel{background:transparent; color:var(--ink-soft); border:2px solid var(--line-strong) !important;}

  .task-card{width:100%; background:var(--surface); border:2px solid var(--line-strong); border-radius:var(--radius-lg); padding:16px 16px 14px; margin-bottom:14px; text-align:left; transition:transform 160ms ease;}
  .task-card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px;}
  .task-heading{font-family:var(--serif); font-size:17px; color:var(--ink); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .task-pct{font-family:var(--sans); font-size:12.5px; color:var(--accent-soft); flex-shrink:0;}
  .task-meta{font-family:var(--sans); font-size:11.5px; color:var(--accent-soft); margin:-4px 0 10px;}
  .progress-track{width:100%; height:5px; background:var(--line); border-radius:999px; overflow:hidden; margin-bottom:12px;}
  .progress-fill{height:100%; background:var(--accent); border-radius:999px;}
  .subtask-list{display:flex; flex-direction:column; gap:9px;}
  .subtask-row{display:flex; align-items:center; gap:10px; font-family:var(--sans); font-size:14px; color:var(--ink); cursor:pointer;}
  .subtask-row input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); flex-shrink:0;}
  .subtask-done{text-decoration:line-through; color:var(--ink-soft);}
  .subtask-empty{font-family:var(--sans); font-size:13px; color:var(--accent-soft); font-style:italic;}

  .detail-subtask-row{display:flex; align-items:center; gap:8px; padding:10px 8px; border-bottom:1px solid var(--line); background:var(--surface); position:relative;}
  #subtaskListWrap .detail-subtask-row:first-child,
  #dailySubtaskListWrap .detail-subtask-row:first-child{border-top-left-radius:var(--radius-md); border-top-right-radius:var(--radius-md);}
  #subtaskListWrap .detail-subtask-row:last-child,
  #dailySubtaskListWrap .detail-subtask-row:last-child{border-bottom-left-radius:var(--radius-md); border-bottom-right-radius:var(--radius-md); border-bottom:none;}
  .detail-subtask-row.dragging{background:var(--bg); box-shadow:0 6px 18px rgba(49,53,42,0.14); border-radius:8px;}
  .detail-subtask-row input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); flex-shrink:0;}
  .detail-subtask-name{flex:1; font-family:var(--sans); font-size:14.5px; color:var(--ink); min-width:0; overflow-wrap:break-word;}
  .subtask-meta{font-family:var(--sans); font-size:11px; color:var(--accent-soft); margin-top:2px;}
  .detail-subtask-del{border:none; background:transparent; color:var(--accent-soft); font-size:16px; padding:4px 6px; flex-shrink:0;}
  .drag-handle{flex-shrink:0; width:22px; height:28px; display:flex; align-items:center; justify-content:center; color:var(--accent-soft); cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none;}
  .subtask-edit-row{flex:1; min-width:0;}
  .section-block{width:100%; margin-bottom:26px;}
  .desc-input{width:100%; min-height:100px; font-family:var(--sans); font-weight:300; font-size:14.5px; line-height:1.6; color:var(--ink); background:var(--surface); border:2px solid var(--line-strong); border-radius:var(--radius-md); padding:12px; resize:vertical; outline:none;}
  .small-btn{border:2px solid var(--line-strong); background:transparent; color:var(--ink-soft); border-radius:999px; padding:8px 16px; font-size:13px; font-family:var(--sans); margin-top:12px;}

  #updateToast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(120%); opacity:0; pointer-events:none; width:min(92%,420px); background:var(--ink); color:var(--surface); border-radius:var(--radius-lg); padding:13px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; z-index:60; box-shadow:0 10px 30px rgba(49,53,42,0.25); transition:transform 260ms ease, opacity 260ms ease;}
  #updateToast.show{transform:translateX(-50%) translateY(0); opacity:1; pointer-events:auto;}
  #updateToast .msg{font-family:var(--sans); font-weight:300; font-size:13.5px; line-height:1.4;}
  #updateToast .refresh-btn{flex-shrink:0; border:none; background:var(--accent-soft); color:var(--ink); font-family:var(--sans); font-weight:400; font-size:13px; border-radius:999px; padding:8px 14px;}

  .celebrate-layer{position:fixed; inset:0; z-index:70; pointer-events:none; overflow:hidden;}
  .confetti-piece{position:absolute; border-radius:2px; opacity:0; transform:translate(-50%,-50%);}
  @keyframes confettiFly{
    0%{ opacity:1; transform:translate(-50%,-50%) translate(0,0) rotate(0deg); }
    70%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-50%) translate(var(--dx),calc(var(--dy) + 160px)) rotate(var(--rot)); }
  }
  .celebrate-badge{position:fixed; width:56px; height:56px; margin-left:-28px; margin-top:-28px; border-radius:999px; background:var(--accent); color:var(--surface); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px rgba(49,53,42,0.28); animation:badgePop 900ms cubic-bezier(.34,1.56,.64,1) forwards;}
  @keyframes badgePop{
    0%{ transform:scale(0.3); opacity:0; }
    45%{ transform:scale(1.15); opacity:1; }
    65%{ transform:scale(0.96); }
    85%{ transform:scale(1.04); }
    100%{ transform:scale(1); opacity:0; }
  }
</style>
</head>
<body>
<div id="bg"></div>
<button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle dark mode">
  <svg id="themeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"></svg>
</button>
<input type="file" id="photoFileInput" accept="image/*" multiple style="display:none" onchange="handlePhotoFileInput(event)">
<div id="app">

  <div id="journal" class="screen active">
    <div class="eyebrow">Flash Journal</div>
    <div class="view-toggle" id="journalToggle">
      <button class="view-btn active" id="journalWriteBtn" onclick="setJournalView('write')">Write</button>
      <button class="view-btn" id="journalReflectBtn" onclick="setJournalView('reflect')">Reflect</button>
    </div>

    <div id="write" class="subview active">
      <div class="dots" id="dots"></div>
      <div class="location-row" id="locationRow">
        <button class="location-btn" id="locationBtn" onclick="useCurrentLocation()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span id="locationLabel">Add location</span>
        </button>
        <button class="location-edit-btn" onclick="editLocation()" aria-label="Type location manually">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>
      <div class="photo-strip" id="writePhotoRow"></div>
      <div id="stepWrap">
        <h1 class="prompt" id="promptText"></h1>
        <textarea class="field" id="fieldInput" rows="6"></textarea>
      </div>
      <button class="next-btn" id="nextBtn" onclick="stepNext()">
        <span id="nextLabel">Continue</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>

    <div id="reflect" class="subview">
      <div id="reflectBody" style="width:100%;"></div>
    </div>
  </div>

  <div id="entryDetail" class="screen">
    <div class="back-row">
      <button class="back-btn" onclick="closeEntryDetail()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1 class="title" style="margin:0; font-size:22px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Entry</h1>
      <button class="back-btn" id="entryEditBtn" onclick="toggleEditEntry()" aria-label="Edit entry">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button class="back-btn" onclick="deleteEntry()" aria-label="Delete entry">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>

  // ---- Dark mode ----

  function seededBlobs(){
    let seed = 42;
    const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const bgEl = document.getElementById("bg");
    let styleTag = "";
    for (let i = 0; i < 5; i++){
      const size = 260 + rand() * 220;
      const top = rand() * 90;
      const left = rand() * 90;
      const duration = 34 + rand() * 26;
      const delay = -rand() * 30;
      const driftX = 30 + rand() * 40;
      const driftY = 20 + rand() * 30;
      const div = document.createElement("div");
      div.className = "blob";
      div.style.top = top + "%";
      div.style.left = left + "%";
      div.style.width = size + "px";
      div.style.height = size + "px";
      div.style.background = BLOB_PALETTE[i % BLOB_PALETTE.length];
      div.style.animation = `driftBlob${i} ${duration}s ease-in-out ${delay}s infinite`;
      bgEl.appendChild(div);
      styleTag += `@keyframes driftBlob${i} {
        0% { transform: translate(0px,0px) scale(1); }
        33% { transform: translate(${driftX}px, -${driftY}px) scale(1.08); }
        66% { transform: translate(-${driftX*0.7}px, ${driftY}px) scale(0.95); }
        100% { transform: translate(0px,0px) scale(1); }
      }\n`;
    }
    const styleEl = document.createElement("style");
    styleEl.textContent = styleTag;
    document.head.appendChild(styleEl);
  }

  // ---- Device geolocation (with reverse geocoding + real error states) ----
  function getDeviceLocation(){
    return new Promise((resolve, reject) => {
      if (!("geolocation" in navigator)){
        reject({ code: 0, message: "Location isn't supported on this device." });
        return;
      }
      if (window.isSecureContext === false){
        reject({ code: 0, message: "Location needs a secure (https) connection." });
        return;
      }
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude } = pos.coords;
          let label = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}&zoom=14`, {
              headers: { "Accept-Language": navigator.language || "en" }
            });
            if (res.ok){
              const data = await res.json();
              const a = data.address || {};
              const place = a.neighbourhood || a.suburb || a.village || a.town || a.city_district || a.city || a.county;
              const region = a.state || a.country;
              label = [place, region].filter(Boolean).join(", ") || data.display_name || label;
            }
          } catch (err){ /* fall back to raw coordinates */ }
          resolve({ lat: latitude, lon: longitude, label });
        },
        (err) => {
          let message = "Couldn't get your location.";
          if (err.code === err.PERMISSION_DENIED) message = "Location access is turned off for this app.";
          else if (err.code === err.POSITION_UNAVAILABLE) message = "Your location isn't available right now.";
          else if (err.code === err.TIMEOUT) message = "Location took too long to respond.";
          reject({ code: err.code, message });
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
      );
    });
  }

  window.useCurrentLocation = async function(){
    const btn = document.getElementById("locationBtn");
    const label = document.getElementById("locationLabel");
    if (btn) btn.classList.add("locating");
    if (label) label.textContent = "Locating…";
    try {
      pendingLocation = await getDeviceLocation();
    } catch (err){
      pendingLocation = null;
      restoreLocationButton();
      if (label) label.textContent = (err && err.message) || "Couldn't get location";
      if (btn) btn.classList.add("locating");
      setTimeout(updateLocationLabel, 2600);
      return;
    }
    restoreLocationButton();
  }

  window.editLocation = function(){
    const wrap = document.getElementById("locationRow");
    if (!wrap) return;
    const current = pendingLocation && pendingLocation.label ? pendingLocation.label : "";
    wrap.innerHTML = `
      <div class="inline-add-row">
        <input type="text" class="inline-add-input" id="locationInput" placeholder="Add a location" value="${escapeHtml(current)}" />
        <button class="inline-add-icon inline-add-confirm" onclick="submitLocation()" aria-label="Save">${CHECK_SVG}</button>
        <button class="inline-add-icon inline-add-cancel" onclick="cancelLocationInput()" aria-label="Cancel">${CLOSE_SVG}</button>
      </div>`;
    const inp = document.getElementById("locationInput");
    inp.focus();
    inp.select();
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter"){ e.preventDefault(); submitLocation(); }

  window.submitLocation = function(){
    const inp = document.getElementById("locationInput");
    if (!inp) return;
    const trimmed = inp.value.trim();
    pendingLocation = trimmed ? { lat: null, lon: null, label: trimmed } : null;
    restoreLocationButton();
  }

  window.cancelLocationInput = function(){
    restoreLocationButton();
  }

  function restoreLocationButton(){
    const wrap = document.getElementById("locationRow");
    if (!wrap) return;
    const label = pendingLocation && pendingLocation.label ? pendingLocation.label : "Add location";
    wrap.innerHTML = `
      <button class="location-btn" id="locationBtn" onclick="useCurrentLocation()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="locationLabel">${escapeHtml(label)}</span>
      </button>
      <button class="location-edit-btn" onclick="editLocation()" aria-label="Type location manually">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>`;

  function updateLocationLabel(){
    const el = document.getElementById("locationLabel");
    if (el) el.textContent = pendingLocation && pendingLocation.label ? pendingLocation.label : "Add location";
    const btn = document.getElementById("locationBtn");

  function fileToResizedDataURL(file, maxDim, quality){
    maxDim = maxDim || 1000;
    quality = quality || 0.75;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let width = img.width, height = img.height;
          if (width > maxDim || height > maxDim){
            if (width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
            else { width = Math.round(width * maxDim / height); height = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  window.triggerPhotoUpload = function(target){
    photoUploadTarget = target;
    document.getElementById("photoFileInput").click();
  }

  window.handlePhotoFileInput = async function(e){
    const files = Array.from(e.target.files || []);
    const target = photoUploadTarget;
    e.target.value = "";
    if (!files.length) return;
    let dataUrls;
    try {
      dataUrls = await Promise.all(files.map(f => fileToResizedDataURL(f)));
    } catch(err){
      return;
    }
    if (target === "write"){
      pendingImages = pendingImages.concat(dataUrls);
      renderWritePhotoRow();
    } else if (target){
      const g = taskGroups.find(x => x.id === target);
      if (g){
        g.images = (g.images || []).concat(dataUrls);
        saveTasks();
        renderTaskDetail();
      }
    }
  }

      <div class="thumb-sm">

      </div>`).join("");
    html += `<button class="thumb-add" onclick="triggerPhotoUpload('write')">+</button>`;

  window.openLightbox = function(imgEl){

  // ---- 100% celebration animation ----
  const CONFETTI_COLORS = ["#6B7A54", "#98A382", "#C9D2B4", "#D9C9B0", "#CBB9C2", "#D4CDA8"];

  function celebrate(anchorEl){
    const layer = document.createElement("div");
    layer.className = "celebrate-layer";
    document.body.appendChild(layer);

    // Badge burst near the anchor (falls back to screen center).
    const rect = anchorEl && anchorEl.getBoundingClientRect
      ? anchorEl.getBoundingClientRect()
      : { left: window.innerWidth/2 - 20, top: window.innerHeight/2 - 20, width: 40, height: 40 };
    const originX = rect.left + rect.width / 2;
    const originY = Math.max(rect.top + 24, 90);

    const badge = document.createElement("div");
    badge.className = "celebrate-badge";
    badge.style.left = originX + "px";
    badge.style.top = originY + "px";
    badge.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>';
    layer.appendChild(badge);

    const pieceCount = 26;
    for (let i = 0; i < pieceCount; i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      const angle = (Math.random() * Math.PI * 2);
      const dist = 90 + Math.random() * 150;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 40;
      const rot = (Math.random() * 520) - 260;
      const size = 6 + Math.random() * 6;
      const delay = Math.random() * 80;
      const duration = 900 + Math.random() * 500;
      piece.style.left = originX + "px";
      piece.style.top = originY + "px";
      piece.style.width = size + "px";
      piece.style.height = (size * 0.4) + "px";
      piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      piece.style.setProperty("--dx", dx + "px");
      piece.style.setProperty("--dy", dy + "px");
      piece.style.setProperty("--rot", rot + "deg");
      piece.style.animation = `confettiFly ${duration}ms cubic-bezier(.2,.7,.3,1) ${delay}ms forwards`;
      layer.appendChild(piece);
    }

    if (navigator.vibrate) { try { navigator.vibrate(30); } catch(e){} }
    setTimeout(() => layer.remove(), 1700);
  }

  function timeOnly(ts){
    return new Date(ts).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
  }

  function timeAgo(ts){
    const d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()){
      return d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
    }
    return d.toLocaleDateString(undefined, {month:"short", day:"numeric", year: d.getFullYear()!==now.getFullYear() ? "numeric": undefined});
  }

  function dateHeading(ts){
    const d = new Date(ts), now = new Date();
    const y = new Date(now); y.setDate(now.getDate()-1);
    if (d.toDateString() === now.toDateString()) return "Today";
    if (d.toDateString() === y.toDateString()) return "Yesterday";
    return d.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric", year: d.getFullYear()!==now.getFullYear() ? "numeric": undefined});
  }

  function truncate(s, n){
    if (!s) return "—";
    return s.length > n ? s.slice(0, n).trim() + "…" : s;
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function setupInfiniteScroll(totalCount){
    if (io) { io.disconnect(); io = null; }
    const sentinel = document.getElementById("scrollSentinel");
    if (!sentinel || visibleCount >= totalCount) return;
    io = new IntersectionObserver((es) => {
      if (es[0].isIntersecting){
        visibleCount = Math.min(visibleCount + PAGE_SIZE, totalCount);
        renderReflect();
      }
    }, { rootMargin: "200px" });
    io.observe(sentinel);
  }

  function renderReflect(){
    const body = document.getElementById("reflectBody");
    if (entries.length === 0){
      body.innerHTML = `<div class="empty"><div class="h">Nothing here yet</div><div class="p">Write something, then come back.</div></div>`;
      return;
    }

    const toggleHtml = `
      <div class="view-toggle">
        <button class="view-btn ${currentView==='timeline'?'active':''}" onclick="setView('timeline')">Timeline</button>
        <button class="view-btn ${currentView==='table'?'active':''}" onclick="setView('table')">Table</button>
      </div>`;

    const visible = entries.slice(0, visibleCount);
    let contentHtml = "";

    if (currentView === "timeline"){
      let lastKey = null;
      visible.forEach((e) => {
        const key = new Date(e.ts).toDateString();
        if (key !== lastKey){
          contentHtml += `<div class="date-heading">${dateHeading(e.ts)}</div>`;
          lastKey = key;
        }
        const meta = [timeOnly(e.ts)];
        if (e.location && e.location.label) meta.push(escapeHtml(e.location.label));
        if (e.images && e.images.length) meta.push("📷 " + e.images.length);
        contentHtml += `
          <div class="entry">
            <button class="entry-head" onclick="openEntry('${e.id}')">
              <div style="min-width:0; flex:1;">
                <div class="entry-date">${meta.join(' · ')}</div>
                <div class="entry-happened">${escapeHtml(e.happened)}</div>
              </div>
              <svg class="chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 6 15 12 9 18"/></svg>
            </button>
          </div>`;
      });
    } else {
      let rows = "";
      visible.forEach((e) => {
        rows += `
          <tr class="row-tap" onclick="openEntry('${e.id}')">
            <td>${timeAgo(e.ts)}</td>
            <td>${escapeHtml(truncate(e.location && e.location.label, 22))}</td>
            <td>${escapeHtml(truncate(e.happened, 50))}</td>
            <td>${escapeHtml(truncate(e.thought, 50))}</td>
            <td>${escapeHtml(truncate(e.feeling, 50))}</td>
          </tr>`;
      });
      contentHtml = `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Time</th><th>Place</th><th>Situation</th><th>Thought</th><th>Feeling</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    const moreHtml = visibleCount < entries.length
      ? `<div class="loading-more" id="scrollSentinel">Loading more…</div>`
      : "";

    body.innerHTML = toggleHtml + contentHtml + moreHtml;
    setupInfiniteScroll(entries.length);
  }

  window.setView = function(v){
    currentView = v;
    visibleCount = PAGE_SIZE;
    renderReflect();
  }

  function showScreen(id){
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    const hideTabbar = (id === "entryDetail" || id === "taskDetail");
    document.getElementById("tabbar").style.display = hideTabbar ? "none" : "flex";

  // ---- Hardware/gesture back-button navigation ----
  // Every screen transition pushes a history entry so the phone's back
  // button steps back through the app's own screens instead of leaving
  // the PWA. If a text field is focused (soft keyboard is up), the first
  // back press only closes the keyboard; it does not navigate.
  let suppressPop = false;

  function pushNavState(label){
    history.pushState({ label: label }, "", "");
  }

  function goBackHistory(){
    suppressPop = true;
    history.back();
  }

  function isTypingFocused(){
    const el = document.activeElement;
    return !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
  }

  function handleHardwareBack(){
    const activeScreen = document.querySelector(".screen.active");

      showScreen("tasks");
      renderCurrentTaskSubtab();
    } else if (id === "tasks" && taskSubtab !== "objectives"){
      setTaskSubtab("objectives", true);
    } else if (id === "tasks"){
      switchTab("journal", true);
    } else if (id === "journal" && journalView === "reflect"){

    // (standard "leave/minimize the app" behavior).
  }

      // press still performs the screen navigation.

  // ---- Tasks ----

  function taskProgress(g){
    const total = g.tasks.length;
    const done = g.tasks.filter(t => t.done).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    return { total, done, pct };
  }

  function filterTaskGroups(groups){
    const today = todayStr();
    return groups.filter(g => {
      const { total, pct } = taskProgress(g);
      switch(taskFilter){
        case "today": return g.date === today;
        case "completed": return total > 0 && pct === 100;
        case "uncompleted": return !(total > 0 && pct === 100);
        case "started": return pct > 0 && pct < 100;
        case "notstarted": return pct === 0;
        default: return true;
      }
    });
  }

  function formatDeadline(iso){
    const d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ' · ' + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function toLocalInputValue(iso){
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  window.setTaskDeadline = function(gid, val){
    const g = taskGroups.find(x => x.id === gid);
    if (!g) return;
    g.deadline = val ? new Date(val).toISOString() : null;
    saveTasks();
    renderTaskDetailSwatch();
    const input = document.getElementById("taskDetailDeadline");
    if (input) input.classList.toggle("overdue", !!(g.deadline && new Date(g.deadline) < new Date() && taskProgress(g).pct < 100));
  }

  window.setTaskCreated = function(gid, val){
    const g = taskGroups.find(x => x.id === gid);
    if (!g || !val) return;

    if (input) input.classList.toggle("overdue", !!(g.deadline && new Date(g.deadline) < new Date() && taskProgress(g).pct < 100));
  }

  function nextTaskColor(c){
    const idx = TASK_COLORS.indexOf(c || null);
    return TASK_COLORS[(idx + 1) % TASK_COLORS.length];
  }

  // Fraction of the time between creation and deadline that has elapsed
  // (0 = just created, 1 = deadline reached or passed). Null if no deadline.
  function deadlineProgress(g){
    if (!g.deadline || !g.createdAt) return null;
    const start = g.createdAt;
    const end = new Date(g.deadline).getTime();
    const now = Date.now();
    if (end <= start) return 1;
    return Math.max(0, Math.min(1, (now - start) / (end - start)));
  }

  // Darkens a hex color toward black by `amount` (0..1) — used so the
  // chosen status color deepens as its deadline gets closer.
  function darkenHex(hex, amount){
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    const factor = 1 - amount * 0.55;
    const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
    return `rgb(${clamp(r * factor)}, ${clamp(g * factor)}, ${clamp(b * factor)})`;
  }

  // A single tint for a task's color that already accounts for deadline
  // proximity — null if no status color has been chosen at all.
  function accentTint(g){
    if (!g.color) return null;
    return darkenHex(g.color, deadlineProgress(g) || 0);
  }

  // Button visuals: a plain color when there's no deadline, or a
  // conic-gradient "pie" fill that grows (and darkens) as the deadline
  // approaches, matched by an equal-and-opposite unfilled track color.
  function swatchVisuals(g){
    if (!g.color) return { background: "transparent", borderColor: "var(--line-strong)" };
    const frac = deadlineProgress(g);
    const tint = darkenHex(g.color, frac || 0);
    if (frac === null) return { background: tint, borderColor: tint };
    const pct = Math.round(frac * 100);
    return { background: `conic-gradient(${tint} ${pct}%, var(--line-strong) ${pct}% 100%)`, borderColor: tint };
  }

  window.cycleTaskColor = function(gid, event){
    if (event) event.stopPropagation();
    const g = taskGroups.find(x => x.id === gid);
    if (!g) return;
    g.color = nextTaskColor(g.color);
    saveTasks();
    renderTasks();
  }

  function renderTaskCard(g){
    const { total, pct } = taskProgress(g);
    const subtasksHtml = g.tasks.map(t => `
      <label class="subtask-row" onclick="event.stopPropagation()">
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleSubtask('${g.id}','${t.id}')">
        <span class="${t.done ? 'subtask-done' : ''}">${escapeHtml(t.name)}</span>
      </label>`).join("");
    const metaBits = [];
    if (g.createdAt) metaBits.push(timeAgo(g.createdAt));
    if (g.location && g.location.label) metaBits.push(escapeHtml(g.location.label));
    const tint = accentTint(g);
    const v = swatchVisuals(g);
    const borderStyle = tint ? `border-left:4px solid ${tint};` : '';
    const deadlineHtml = g.deadline ? `<div class="task-deadline" style="color:${tint || 'var(--accent-soft)'};">Due by ${formatDeadline(g.deadline)}</div>` : '';
    return `
      <div class="task-card" style="${borderStyle}" onclick="openTaskDetail('${g.id}')" data-gid="${g.id}">
        <div class="task-card-head">
          <div class="task-heading">${escapeHtml(g.heading)}</div>
          <button class="color-swatch" style="background:${v.background}; border-color:${v.borderColor};" onclick="cycleTaskColor('${g.id}', event)" aria-label="Cycle status color"></button>
          <div class="task-pct">${total ? pct + '%' : '—'}</div>
        </div>
        ${deadlineHtml}
        ${metaBits.length ? `<div class="task-meta">${metaBits.join(' · ')}</div>` : ''}
        ${total ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>` : ''}
        <div class="subtask-list">${subtasksHtml || '<div class="subtask-empty">No sub-tasks yet</div>'}</div>
      </div>`;
  }

  function renderTasks(){

      body.innerHTML = `<div class="empty"><div class="h">No tasks yet</div><div class="p">Tap "New task" to add your first checklist.</div></div>`;

    const filtered = filterTaskGroups(taskGroups);
    if (filtered.length === 0){
      body.innerHTML = `<div class="empty"><div class="h">Nothing here</div><div class="p">No tasks match this filter.</div></div>`;
      return;
    }
    body.innerHTML = filtered.map(renderTaskCard).join("");
  }

  // Best-effort background location capture for a newly created task or

    t.done = !t.done;

    if (!inp) return;
    const name = inp.value.trim();
    const g = taskGroups.find(x => x.id === detailTaskId);
    const t = g && g.tasks.find(x => x.id === tid);
    if (t && name) t.name = name;
    saveTasks();
    renderTaskDetail();
  }

  window.cancelRenameSubtask = function(tid){
    renderTaskDetail();
  }

  // ---- Sub-task drag-to-reorder ----
  window.startSubtaskDrag = function(e, tid){
    e.preventDefault();
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    const list = document.getElementById("subtaskListWrap");
    if (!list) return;
    const rows = Array.from(list.querySelectorAll(".detail-subtask-row"));
    const draggedRow = rows.find(r => r.dataset.tid === tid);
    if (!draggedRow) return;
    const originalIndex = g.tasks.findIndex(t => t.id === tid);
    if (originalIndex === -1) return;

    const rects = rows.map(r => ({
      tid: r.dataset.tid,
      el: r,
      top: r.getBoundingClientRect().top,
      height: r.offsetHeight
    }));
    const rowHeight = draggedRow.offsetHeight;
    const startY = e.clientY;
    let currentTargetIndex = originalIndex;

    draggedRow.classList.add("dragging");
    draggedRow.style.position = "relative";
    draggedRow.style.zIndex = "5";

    function onMove(ev){
      const deltaY = ev.clientY - startY;
      draggedRow.style.transform = `translateY(${deltaY}px)`;

      const draggedTop = rects[originalIndex].top + deltaY;
      const draggedCenter = draggedTop + rowHeight / 2;

      let newIndex = 0;
      rects.forEach((r) => {
        if (r.tid === tid) return;
        const otherCenter = r.top + r.height / 2;
        if (draggedCenter > otherCenter) newIndex++;
      });
      if (newIndex > rects.length - 1) newIndex = rects.length - 1;

      if (newIndex !== currentTargetIndex){
        currentTargetIndex = newIndex;
        rects.forEach((r, idx) => {
          if (r.tid === tid) return;
          let shift = 0;
          if (idx >= currentTargetIndex && idx < originalIndex) shift = rowHeight;
          else if (idx <= currentTargetIndex && idx > originalIndex) shift = -rowHeight;
          r.el.style.transform = shift ? `translateY(${shift}px)` : "";
          r.el.style.transition = "transform 150ms ease";
        });
      }
    }

    function onUp(){
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);

      draggedRow.classList.remove("dragging");
      draggedRow.style.transform = "";
      draggedRow.style.zIndex = "";
      rects.forEach(r => {
        if (r.tid !== tid){
          r.el.style.transform = "";
          r.el.style.transition = "";
        }
      });

      if (currentTargetIndex !== originalIndex){
        const [moved] = g.tasks.splice(originalIndex, 1);
        g.tasks.splice(currentTargetIndex, 0, moved);
        saveTasks();
      }
      renderTaskDetail();
    }

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  }

  window.toggleSubtaskDetail = function(tid){
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    const t = g.tasks.find(x => x.id === tid);
    if (!t) return;
    const before = taskProgress(g).pct;
    t.done = !t.done;
    const after = taskProgress(g).pct;
    saveTasks();
    renderTaskDetail();
    if (after === 100 && before !== 100){
      celebrate(document.getElementById("taskDetailBody"));
    }
  }

  window.deleteSubtask = function(tid){
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    g.tasks = g.tasks.filter(x => x.id !== tid);
    saveTasks();
    renderTaskDetail();
  }

  window.deleteTaskGroup = function(){
    if (!window.confirm("Delete this task and all its sub-tasks?")) return;
    taskGroups = taskGroups.filter(x => x.id !== detailTaskId);
    saveTasks();
    showScreen("tasks");
    renderCurrentTaskSubtab();
    goBackHistory();
  }

  window.removeTaskImage = function(idx){
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    g.images.splice(idx, 1);
    saveTasks();
    renderTaskDetail();
  }

  function bindTaskDescInput(){
    const el = document.getElementById("taskDescInput");
    if (!el) return;
    el.addEventListener("input", () => {
      const g = taskGroups.find(x => x.id === detailTaskId);
      if (!g) return;
      g.description = el.value;
      saveTasks();
    });
  }

  function renderTaskDetail(){
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    const headingEl = document.getElementById("taskDetailHeading");
    if (headingEl) headingEl.textContent = g.heading;
    const { total, done, pct } = taskProgress(g);

    const subtasksHtml = g.tasks.map(t => `
      <div class="detail-subtask-row" data-tid="${t.id}">
        <div class="drag-handle" onpointerdown="startSubtaskDrag(event,'${t.id}')" aria-label="Drag to reorder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"/><circle cx="16" cy="6" r="1.6"/><circle cx="8" cy="12" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="8" cy="18" r="1.6"/><circle cx="16" cy="18" r="1.6"/></svg>
        </div>
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleSubtaskDetail('${t.id}')">
        <div class="subtask-edit-row" id="subtaskEditRow_${t.id}">
          <div class="detail-subtask-name" onclick="renameSubtask('${t.id}')" style="${t.done ? 'text-decoration:line-through;color:var(--ink-soft);' : ''}">${escapeHtml(t.name)}</div>
          ${t.createdAt ? `<div class="subtask-meta">${timeOnly(t.createdAt)}${t.location && t.location.label ? ' · ' + escapeHtml(t.location.label) : ''}</div>` : ''}
        </div>
        <button class="detail-subtask-del" onclick="deleteSubtask('${t.id}')">×</button>
      </div>`).join("");

    const imagesHtml = (g.images || []).map((src, i) => `
      <div class="photo-tile">
        <img src="${src}" onclick="openLightbox(this)">
        <button class="thumb-remove" onclick="removeTaskImage(${i})">×</button>
      </div>`).join("");

    const body = document.getElementById("taskDetailBody");
    body.innerHTML = `
      <div class="section-block" style="margin-bottom:20px;">
        <div class="label">Created</div>
        <input type="datetime-local" class="deadline-input" id="taskDetailCreated" style="width:100%; margin-top:6px; margin-bottom:12px;" value="${g.createdAt ? toLocalInputValue(g.createdAt) : ''}" onchange="setTaskCreated('${g.id}', this.value)">
        <div class="location-row" id="taskLocationRow" style="justify-content:flex-start; margin-bottom:12px;"></div>
        <div class="label">Deadline</div>
        <input type="datetime-local" class="deadline-input ${g.deadline && new Date(g.deadline) < new Date() && pct < 100 ? 'overdue' : ''}" id="taskDetailDeadline" style="width:100%; margin-top:6px;" value="${g.deadline ? toLocalInputValue(g.deadline) : ''}" onchange="setTaskDeadline('${g.id}', this.value)">
      </div>
      <div class="section-block">
        ${total ? `<div class="progress-track"><div class="progress-fill" id="taskProgressFill" style="width:${pct}%"></div></div>` : ''}
        <div class="label">${total ? `${done}/${total} done · ${pct}%` : 'No sub-tasks yet'}</div>
      </div>
      <div class="section-block">
        <div class="label">Sub-tasks</div>
        <div class="subtasks-box">
          <div id="subtaskListWrap">${subtasksHtml}</div>
          <div class="add-btn-wrap" id="newSubtaskRow" style="margin-top:12px; margin-bottom:0;">
            <button class="small-btn" onclick="showNewSubtaskInput()">+ Add sub-task</button>
          </div>
        </div>
      </div>
      <div class="section-block">
        <div class="label">Description</div>
        <textarea class="desc-input" id="taskDescInput" placeholder="Add notes about this task…">${escapeHtml(g.description || "")}</textarea>
      </div>
      <div class="section-block">
        <div class="label">Photos</div>
        <div class="photo-grid" style="margin-top:8px;">
          ${imagesHtml}
          <button class="photo-add-tile" onclick="triggerPhotoUpload('${g.id}')">+</button>
        </div>
      </div>`;
    bindTaskDescInput();
    renderTaskLocationRow();
    renderTaskDetailSwatch();
  }

  // ---- Daily Objectives ----
  window.setDailyView = function(v){
    dailyView = v;
    document.querySelectorAll("#dailyViewToggle .view-btn").forEach(b => b.classList.toggle("active", b.dataset.key === v));
    renderDaily();
  }

  function renderDaily(){
    const body = document.getElementById("dailyBody");
    if (dailyView === "today") renderDailyToday(body);
    else renderDailyHistory(body);
  }

  function renderDailyToday(body){
    const log = todayLogEntry();
    const total = dailyObjective.tasks.length;
    const done = dailyObjective.tasks.filter(t => log[t.id] && log[t.id].done).length;
    const pct = total ? Math.round(done / total * 100) : 0;

    const listHtml = total ? dailyObjective.tasks.map(t => {
      const checked = !!(log[t.id] && log[t.id].done);
      return `
        <div class="detail-subtask-row" data-tid="${t.id}">
          <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleDailySubtask('${t.id}')">
          <div class="subtask-edit-row" id="dailySubtaskEditRow_${t.id}">
            <div class="detail-subtask-name" onclick="renameDailySubtask('${t.id}')" style="${checked ? 'text-decoration:line-through;color:var(--ink-soft);' : ''}">${escapeHtml(t.name)}</div>
          </div>
          <button class="detail-subtask-del" onclick="deleteDailySubtask('${t.id}')">×</button>
        </div>`;
    }).join("") : `<div class="empty"><div class="h">Nothing yet</div><div class="p">Add sub-tasks you want to track every day. They uncheck automatically after midnight.</div></div>`;

    body.innerHTML = `
      ${total ? `<div class="section-block" style="margin-bottom:6px;"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="label">${done}/${total} done today · ${pct}%</div></div>` : ''}
      <div class="subtasks-box">
        <div id="dailySubtaskListWrap" style="width:100%;">${listHtml}</div>
        <div class="add-btn-wrap" id="newDailySubtaskRow" style="margin-top:12px; margin-bottom:0;">
          <button class="small-btn" onclick="showNewDailySubtaskInput()">+ Add sub-task</button>
        </div>
      </div>`;
  }

  function renderDailyHistory(body){
    const dates = Object.keys(dailyLog).sort((a, b) => new Date(b) - new Date(a));
    const rows = [];
    dates.forEach(dateKey => {
      const dayEntries = dailyLog[dateKey];
      Object.keys(dayEntries).forEach(tid => {
        const e = dayEntries[tid];
        rows.push({ date: dateKey, name: e.name || '(deleted)', done: !!e.done, completedAt: e.completedAt });
      });
    });
    if (rows.length === 0){
      body.innerHTML = `<div class="empty"><div class="h">Nothing logged yet</div><div class="p">Check off a sub-task and it'll show up here.</div></div>`;
      return;
    }
    const trs = rows.map(r => `
      <tr>
        <td>${new Date(r.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</td>
        <td>${escapeHtml(r.name)}</td>
        <td>${r.done ? 'Yes' : 'No'}</td>
        <td>${r.completedAt ? new Date(r.completedAt).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '—'}</td>
      </tr>`).join("");
    body.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Sub-task</th><th>Completed</th><th>Time</th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  window.toggleDailySubtask = function(tid){
    const log = todayLogEntry();
    const t = dailyObjective.tasks.find(x => x.id === tid);
    if (!t) return;
    const nowDone = !(log[tid] && log[tid].done);
    log[tid] = { done: nowDone, name: t.name, completedAt: nowDone ? Date.now() : null };
    saveDailyLog();
    renderDaily();
    if (nowDone){
      const total = dailyObjective.tasks.length;
      const doneCount = dailyObjective.tasks.filter(x => log[x.id] && log[x.id].done).length;
      if (total > 0 && doneCount === total) celebrate(document.getElementById("dailyBody"));
    }
  }

  window.showNewDailySubtaskInput = function(){
    const wrap = document.getElementById("newDailySubtaskRow");
    if (!wrap) return;
    wrap.innerHTML = `
      <div class="inline-add-row">
        <input type="text" class="inline-add-input" id="newDailySubtaskInput" placeholder="Sub-task name" />
        <button class="inline-add-icon inline-add-confirm" onclick="submitNewDailySubtask()" aria-label="Add">${CHECK_SVG}</button>
        <button class="inline-add-icon inline-add-cancel" onclick="cancelNewDailySubtaskInput()" aria-label="Cancel">${CLOSE_SVG}</button>
      </div>`;
    const inp = document.getElementById("newDailySubtaskInput");
    inp.focus();
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter"){ e.preventDefault(); submitNewDailySubtask(); }
      else if (e.key === "Escape"){ cancelNewDailySubtaskInput(); }
    });
  }

  window.cancelNewDailySubtaskInput = function(){
    const wrap = document.getElementById("newDailySubtaskRow");
    if (wrap) wrap.innerHTML = `<button class="small-btn" onclick="showNewDailySubtaskInput()">+ Add sub-task</button>`;
  }

  window.submitNewDailySubtask = function(){
    const inp = document.getElementById("newDailySubtaskInput");
    if (!inp) return;
    const name = inp.value.trim();
    if (!name){ inp.focus(); return; }
    dailyObjective.tasks.push({ id: uid(), name });
    saveDaily();
    renderDaily();
    showNewDailySubtaskInput();
  }

  window.renameDailySubtask = function(tid){
    const t = dailyObjective.tasks.find(x => x.id === tid);
    if (!t) return;
    const wrap = document.getElementById("dailySubtaskEditRow_" + tid);
    if (!wrap) return;
    wrap.innerHTML = `
      <div class="inline-add-row">
        <input type="text" class="inline-add-input" id="dailyRenameInput_${tid}" value="${escapeHtml(t.name)}" />
        <button class="inline-add-icon inline-add-confirm" onclick="submitRenameDailySubtask('${tid}')" aria-label="Save">${CHECK_SVG}</button>
        <button class="inline-add-icon inline-add-cancel" onclick="renderDaily()" aria-label="Cancel">${CLOSE_SVG}</button>
      </div>`;
    const inp = document.getElementById("dailyRenameInput_" + tid);
    inp.focus();
    inp.select();
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter"){ e.preventDefault(); submitRenameDailySubtask(tid); }
      else if (e.key === "Escape"){ renderDaily(); }
    });
  }

  window.submitRenameDailySubtask = function(tid){
    const inp = document.getElementById("dailyRenameInput_" + tid);
    if (!inp) return;
    const name = inp.value.trim();
    const t = dailyObjective.tasks.find(x => x.id === tid);
    if (t && name) t.name = name;
    saveDaily();
    renderDaily();
  }

  window.deleteDailySubtask = function(tid){
    dailyObjective.tasks = dailyObjective.tasks.filter(x => x.id !== tid);
    saveDaily();
    renderDaily();
  }

  // ---- Task-group location (view/edit) ----
  function renderTaskLocationRow(){
    const g = taskGroups.find(x => x.id === detailTaskId);
    const wrap = document.getElementById("taskLocationRow");
    if (!wrap || !g) return;
    const label = g.location && g.location.label ? g.location.label : "Add location";
    wrap.innerHTML = `
      <button class="location-btn" id="taskLocationBtn" onclick="useCurrentTaskLocation()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="taskLocationLabel">${escapeHtml(label)}</span>
      </button>
      <button class="location-edit-btn" onclick="editTaskLocation()" aria-label="Type location manually">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>`;
  }

  window.useCurrentTaskLocation = async function(){
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    const btn = document.getElementById("taskLocationBtn");
    const label = document.getElementById("taskLocationLabel");
    if (btn) btn.classList.add("locating");
    if (label) label.textContent = "Locating…";
    try {
      g.location = await getDeviceLocation();
      saveTasks();
    } catch (err){
      if (label) label.textContent = (err && err.message) || "Couldn't get location";
      setTimeout(renderTaskLocationRow, 2600);
      return;
    }
    renderTaskLocationRow();
  }

  window.editTaskLocation = function(){
    const g = taskGroups.find(x => x.id === detailTaskId);
    const wrap = document.getElementById("taskLocationRow");
    if (!wrap || !g) return;
    const current = g.location && g.location.label ? g.location.label : "";
    wrap.innerHTML = `
      <div class="inline-add-row">
        <input type="text" class="inline-add-input" id="taskLocationInput" placeholder="Add a location" value="${escapeHtml(current)}" />
        <button class="inline-add-icon inline-add-confirm" onclick="submitTaskLocation()" aria-label="Save">${CHECK_SVG}</button>
        <button class="inline-add-icon inline-add-cancel" onclick="renderTaskLocationRow()" aria-label="Cancel">${CLOSE_SVG}</button>
      </div>`;
    const inp = document.getElementById("taskLocationInput");
    inp.focus();
    inp.select();
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter"){ e.preventDefault(); submitTaskLocation(); }
      else if (e.key === "Escape"){ renderTaskLocationRow(); }
    });
  }

  window.submitTaskLocation = function(){
    const inp = document.getElementById("taskLocationInput");
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!inp || !g) return;
    const trimmed = inp.value.trim();
    g.location = trimmed ? { lat: null, lon: null, label: trimmed } : null;
    saveTasks();
    renderTaskLocationRow();
  }

  seededBlobs();
  renderStep(false);
  updateLocationLabel();
  renderWritePhotoRow();
  history.replaceState({ label: "tab:journal" }, "", "");

  // ---- Daily Objectives midnight rollover ----
  // Completion is keyed by date, so a new day naturally starts unchecked;
  // this just makes an already-open app notice the date changed and redraw.
  lastKnownDate = todayStr();
  function checkDailyRollover(){
    const now = todayStr();
    if (now !== lastKnownDate){
      lastKnownDate = now;
      if (currentTab === "tasks" && taskSubtab === "daily") renderDaily();
    }
  }

  // ---- Keep deadline-urgency colors current while the app stays open ----
  function refreshDeadlineColors(){
    if (currentTab !== "tasks") return;
    const activeScreen = document.querySelector(".screen.active");
    if (activeScreen && activeScreen.id === "tasks" && taskSubtab === "objectives") renderTasks();
    else if (activeScreen && activeScreen.id === "taskDetail") renderTaskDetailSwatch();
  }

  setInterval(() => { checkDailyRollover(); refreshDeadlineColors(); }, 30000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible"){ checkDailyRollover(); refreshDeadlineColors(); }
  });

  // ---- PWA update handling ----
  let waitingWorker = null;

  function showUpdateToast(){
    document.getElementById("updateToast").classList.add("show");
  }

  window.applyUpdate = function(){
    if (waitingWorker){
      waitingWorker.postMessage({ type: "SKIP_WAITING" });
    } else {
      window.location.reload();
    }
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => {

        // A worker is already sitting there waiting (e.g. update happened while app was closed)
        if (reg.waiting){
          waitingWorker = reg.waiting;
          showUpdateToast();
        }

        // A new worker was just found and is installing
        reg.addEventListener("updatefound", () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener("statechange", () => {
            if (newWorker.state === "installed" && navigator.serviceWorker.controller){
              waitingWorker = newWorker;
              showUpdateToast();
            }
          });
        });

        // Poll for updates: whenever the app becomes visible, and every few minutes while open.
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") reg.update().catch(() => {});
        });
        setInterval(() => reg.update().catch(() => {}), 5 * 60 * 1000);

      }).catch(() => {});

      // Once the new worker takes control, reload so the page uses the fresh assets.
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  }
</script>
