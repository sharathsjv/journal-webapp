<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Notice</title>
<meta name="theme-color" content="#EEF0E7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Notice" />
<link rel="apple-touch-icon" href="icon-512.png" />
<link rel="icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<style>
  :root{
    --ink:#31352A; --ink-soft:#6B7160; --bg:#EEF0E7; --line:#DEE1D3;
    --accent:#6B7A54; --accent-soft:#98A382; --surface:#F8F9F3;
    --serif: "Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); overscroll-behavior-y:none; font-weight:300;}
  #bg{position:fixed; inset:0; overflow:hidden; z-index:0;}
  .blob{position:absolute; border-radius:50%; opacity:.38; filter:blur(60px);}
  #app{max-width:460px; margin:0 auto; min-height:100vh; position:relative; z-index:1; display:flex; flex-direction:column; align-items:center;}
  textarea::placeholder{color:var(--accent-soft); opacity:.7; font-weight:300;}
  textarea{caret-color:var(--accent);}
  button{font-family:var(--sans); cursor:pointer;}

  .screen{width:100%; display:none; flex-direction:column; align-items:center;}
  .screen.active{display:flex;}
  #write{min-height:100vh; justify-content:center; padding:24px 26px 130px;}
  #reflect{padding:56px 26px 130px;}
  #tasks{padding:56px 26px 130px;}

  .eyebrow{font-family:var(--sans); font-weight:400; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-soft); margin-bottom:6px;}

  h1.title{font-family:var(--serif); font-weight:300; font-size:26px; margin:0 0 28px; letter-spacing:.005em;}

  .empty{border:1px dashed var(--line); border-radius:14px; padding:28px 20px; text-align:center; width:100%;}
  .empty .h{font-family:var(--serif); font-weight:300; font-size:18px; margin-bottom:6px;}
  .empty .p{font-family:var(--sans); font-weight:300; font-size:14px; color:var(--ink-soft);}

  .entry{border-bottom:1px solid var(--line); width:100%;}
  .entry-head{width:100%; background:none; border:none; padding:16px 2px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; text-align:left;}
  .entry-date{font-family:var(--sans); font-weight:400; font-size:12px; color:var(--accent-soft); margin-bottom:4px;}
  .entry-happened{font-family:var(--serif); font-weight:300; font-size:18px; line-height:1.42; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;}
  .chev{flex-shrink:0; margin-top:6px; color:var(--ink-soft);}
  .label{font-family:var(--sans); font-size:12px; color:var(--accent-soft); margin-bottom:4px;}
  .val{font-family:var(--sans); font-weight:300; font-size:15.5px; line-height:1.6; white-space:pre-wrap;}

  .date-heading{font-family:var(--sans); font-weight:400; font-size:13px; color:var(--accent); margin:22px 0 4px; letter-spacing:.01em;}

  .dots{display:flex; gap:8px; justify-content:center; margin-bottom:20px;}
  .dot{width:6px; height:6px; border-radius:999px; border:1px solid var(--line); transition:background 220ms ease, border-color 220ms ease;}
  .dot.on{background:var(--accent); border-color:var(--accent);}

  #stepWrap{width:100%; display:flex; flex-direction:column; align-items:center; transition:opacity 260ms ease;}
  .prompt{font-family:var(--serif); font-weight:300; font-size:30px; line-height:1.32; margin:0 0 22px; letter-spacing:.005em; text-align:center;}
  .field{font-family:var(--sans); font-weight:300; font-size:17px; line-height:1.6; color:var(--ink); background:transparent; border:none; border-bottom:1px solid var(--line); outline:none; resize:none; padding:4px 2px 14px; width:100%; text-align:center;}

  .next-btn{margin-top:26px; display:flex; align-items:center; gap:8px; border-radius:999px; padding:12px 24px; font-size:14.5px; font-weight:400; letter-spacing:.01em; border:1px solid var(--line); background:transparent; color:var(--ink-soft);}
  .next-btn.ready{background:var(--accent); color:var(--surface); border:none;}

  .tabbar{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:6px; background:rgba(248,249,243,0.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:999px; padding:5px; z-index:2; box-shadow:0 8px 24px rgba(49,53,42,0.10);}
  .tab-btn{display:flex; align-items:center; gap:7px; border:none; border-radius:999px; padding:10px 16px; background:transparent; color:var(--ink-soft); font-size:13.5px; font-weight:400; letter-spacing:.01em;}
  .tab-btn.active{background:var(--accent); color:var(--surface);}

  .view-toggle{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px; margin-bottom:22px;}
  .view-btn{border:none; border-radius:999px; padding:7px 16px; background:transparent; color:var(--ink-soft); font-size:13px; font-weight:400;}
  .view-btn.active{background:var(--accent); color:var(--surface);}

  .table-wrap{width:100%; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  table{border-collapse:collapse; width:100%; table-layout:fixed;}
  th{text-align:left; font-family:var(--sans); font-weight:400; font-size:11.5px; color:var(--accent-soft); padding:8px 6px; border-bottom:1px solid var(--line); overflow-wrap:break-word;}
  td{font-family:var(--sans); font-weight:300; font-size:12.5px; color:var(--ink); padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:break-word; word-break:break-word;}
  th:nth-child(1), td:nth-child(1){width:14%;}
  th:nth-child(2), td:nth-child(2){width:16%;}
  th:nth-child(3), td:nth-child(3){width:24%;}
  th:nth-child(4), td:nth-child(4){width:23%;}
  th:nth-child(5), td:nth-child(5){width:23%;}
  tr.row-tap{cursor:pointer;}

  .loading-more{padding:18px 0; text-align:center; font-family:var(--sans); font-size:12.5px; color:var(--accent-soft); width:100%;}

  #entryDetail{padding:56px 26px 130px;}
  #taskDetail{padding:56px 26px 130px;}
  .back-row{width:100%; display:flex; align-items:center; gap:10px; margin-bottom:24px;}
  .back-btn{border:none; background:transparent; color:var(--ink-soft); display:flex; align-items:center; padding:6px; flex-shrink:0;}
  .detail-happened{font-family:var(--serif); font-weight:300; font-size:20px; line-height:1.5; white-space:pre-wrap;}

  .location-row{width:100%; display:flex; justify-content:center; margin-bottom:14px;}
  .location-btn{border:none; background:transparent; color:var(--ink-soft); font-family:var(--sans); font-size:12.5px; display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; border:1px solid var(--line);}

  .photo-strip{display:flex; gap:8px; overflow-x:auto; width:100%; margin-bottom:20px; padding-bottom:2px;}
  .thumb-sm{position:relative; width:60px; height:60px; border-radius:10px; overflow:hidden; background:var(--line); flex-shrink:0;}
  .thumb-sm img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb-remove{position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(49,53,42,0.65); color:#fff; border:none; font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}
  .thumb-add{width:60px; height:60px; border-radius:10px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--accent-soft); font-size:20px; flex-shrink:0; background:transparent;}

  .photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .photo-tile{position:relative; width:100%; aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:var(--line);}
  .photo-tile img{width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;}
  .photo-add-tile{aspect-ratio:1/1; border:1px dashed var(--line); border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--accent-soft); font-size:24px; background:transparent;}

  .lightbox{position:fixed; inset:0; background:rgba(20,22,16,0.92); z-index:50; display:flex; align-items:center; justify-content:center; padding:24px;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:12px;}

  .filter-row{display:flex; gap:8px; overflow-x:auto; width:100%; margin-bottom:18px; padding-bottom:2px;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{flex-shrink:0; border:1px solid var(--line); background:transparent; color:var(--ink-soft); border-radius:999px; padding:7px 14px; font-size:12.5px; font-family:var(--sans); white-space:nowrap;}
  .filter-chip.active{background:var(--accent); color:var(--surface); border-color:var(--accent);}

  .add-btn{width:100%; border:1px dashed var(--line); border-radius:14px; padding:14px; text-align:center; color:var(--ink-soft); background:transparent; font-family:var(--sans); font-size:14px; margin-bottom:18px;}

  .task-card{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 16px 14px; margin-bottom:14px; text-align:left;}
  .task-card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px;}
  .task-heading{font-family:var(--serif); font-size:17px; color:var(--ink); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .task-pct{font-family:var(--sans); font-size:12.5px; color:var(--accent-soft); flex-shrink:0;}
  .progress-track{width:100%; height:5px; background:var(--line); border-radius:999px; overflow:hidden; margin-bottom:12px;}
  .progress-fill{height:100%; background:var(--accent); border-radius:999px;}
  .subtask-list{display:flex; flex-direction:column; gap:9px;}
  .subtask-row{display:flex; align-items:center; gap:10px; font-family:var(--sans); font-size:14px; color:var(--ink); cursor:pointer;}
  .subtask-row input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); flex-shrink:0;}
  .subtask-done{text-decoration:line-through; color:var(--ink-soft);}
  .subtask-empty{font-family:var(--sans); font-size:13px; color:var(--accent-soft); font-style:italic;}

  .detail-subtask-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .detail-subtask-row input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); flex-shrink:0;}
  .detail-subtask-name{flex:1; font-family:var(--sans); font-size:14.5px; color:var(--ink); min-width:0; overflow-wrap:break-word;}
  .detail-subtask-del{border:none; background:transparent; color:var(--accent-soft); font-size:16px; padding:4px 6px; flex-shrink:0;}
  .section-block{width:100%; margin-bottom:26px;}
  .desc-input{width:100%; min-height:100px; font-family:var(--sans); font-weight:300; font-size:14.5px; line-height:1.6; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; resize:vertical; outline:none;}
  .small-btn{border:1px solid var(--line); background:transparent; color:var(--ink-soft); border-radius:999px; padding:8px 16px; font-size:13px; font-family:var(--sans); margin-top:12px;}
</style>
</head>
<body>
<div id="bg"></div>
<input type="file" id="photoFileInput" accept="image/*" multiple style="display:none" onchange="handlePhotoFileInput(event)">
<div id="app">

  <div id="write" class="screen active">
    <div class="eyebrow">Flash Journal</div>
    <div class="dots" id="dots"></div>
    <div class="location-row">
      <button class="location-btn" id="locationBtn" onclick="editLocation()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="locationLabel">Add location</span>
      </button>
    </div>
    <div class="photo-strip" id="writePhotoRow"></div>
    <div id="stepWrap">
      <h1 class="prompt" id="promptText"></h1>
      <textarea class="field" id="fieldInput" rows="6"></textarea>
    </div>
    <button class="next-btn" id="nextBtn" onclick="stepNext()">
      <span id="nextLabel">Continue</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>

  <div id="reflect" class="screen">
    <div class="eyebrow">Flash Journal</div>
    <h1 class="title">Reflect</h1>
    <div id="reflectBody" style="width:100%;"></div>
  </div>

  <div id="entryDetail" class="screen">
    <div class="back-row">
      <button class="back-btn" onclick="closeEntryDetail()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1 class="title" style="margin:0; font-size:22px;">Entry</h1>
    </div>
    <div id="entryDetailBody" style="width:100%;"></div>
  </div>

  <div id="tasks" class="screen">
    <div class="eyebrow">Tasks</div>
    <h1 class="title">Tasks</h1>
    <div class="filter-row" id="taskFilterRow"></div>
    <button class="add-btn" onclick="addTaskGroup()">+ New task</button>
    <div id="tasksBody" style="width:100%;"></div>
  </div>

  <div id="taskDetail" class="screen">
    <div class="back-row">
      <button class="back-btn" onclick="closeTaskDetail()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1 class="title" id="taskDetailHeading" style="margin:0; font-size:20px; flex:1; cursor:pointer;" onclick="renameTaskHeading()"></h1>
      <button class="back-btn" onclick="deleteTaskGroup()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </div>
    <div id="taskDetailBody" style="width:100%;"></div>
  </div>

  <div class="tabbar" id="tabbar">
    <button class="tab-btn active" id="tabWriteBtn" onclick="switchTab('write')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>
      Write
    </button>
    <button class="tab-btn" id="tabReflectBtn" onclick="switchTab('reflect')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.5 0 2.5 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.5 0 2.5 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.5 0 2.5 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>
      Reflect
    </button>
    <button class="tab-btn" id="tabTasksBtn" onclick="switchTab('tasks')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Tasks
    </button>
  </div>

</div>

<script>
  const STORAGE_KEY = "notice-entries";
  const TASKS_KEY = "notice-tasks";
  const PAGE_SIZE = 20;
  const STEPS = [
    { key: "happened", prompt: "What happened?", placeholder: "Start wherever it makes sense to start." },
    { key: "thought", prompt: "What do you make of it?", placeholder: "The story you're telling yourself about it." },
    { key: "feeling", prompt: "What are you feeling?", placeholder: "Name it, even roughly." }
  ];
  const BLOB_PALETTE = ["#C9D2B4", "#D9C9B0", "#B9C7BE", "#CBB9C2", "#D4CDA8"];
  const TASK_FILTERS = [
    { key: "all", label: "All" },
    { key: "today", label: "Today" },
    { key: "completed", label: "Completed" },
    { key: "uncompleted", label: "Uncompleted" },
    { key: "started", label: "Started" },
    { key: "notstarted", label: "Not started" }
  ];

  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]").sort((a,b)=>b.ts-a.ts);
  let taskGroups = JSON.parse(localStorage.getItem(TASKS_KEY) || "[]");
  let step = 0;
  let form = {};
  let detailEntryId = null;
  let detailTaskId = null;
  let pendingLocation = null;
  let pendingImages = [];
  let photoUploadTarget = null;
  let currentTab = "write";
  let currentView = "timeline";
  let taskFilter = "all";
  let visibleCount = PAGE_SIZE;
  let io = null;

  function uid(){
    return String(Date.now()) + Math.random().toString(36).slice(2, 7);
  }

  function todayStr(){
    return new Date().toDateString();
  }

  function saveTasks(){
    localStorage.setItem(TASKS_KEY, JSON.stringify(taskGroups));
  }

  function seededBlobs(){
    let seed = 42;
    const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const bgEl = document.getElementById("bg");
    let styleTag = "";
    for (let i = 0; i < 5; i++){
      const size = 260 + rand() * 220;
      const top = rand() * 90;
      const left = rand() * 90;
      const duration = 34 + rand() * 26;
      const delay = -rand() * 30;
      const driftX = 30 + rand() * 40;
      const driftY = 20 + rand() * 30;
      const div = document.createElement("div");
      div.className = "blob";
      div.style.top = top + "%";
      div.style.left = left + "%";
      div.style.width = size + "px";
      div.style.height = size + "px";
      div.style.background = BLOB_PALETTE[i % BLOB_PALETTE.length];
      div.style.animation = `driftBlob${i} ${duration}s ease-in-out ${delay}s infinite`;
      bgEl.appendChild(div);
      styleTag += `@keyframes driftBlob${i} {
        0% { transform: translate(0px,0px) scale(1); }
        33% { transform: translate(${driftX}px, -${driftY}px) scale(1.08); }
        66% { transform: translate(-${driftX*0.7}px, ${driftY}px) scale(0.95); }
        100% { transform: translate(0px,0px) scale(1); }
      }\n`;
    }
    const styleEl = document.createElement("style");
    styleEl.textContent = styleTag;
    document.head.appendChild(styleEl);
  }

  window.editLocation = function(){
    const current = pendingLocation && pendingLocation.label ? pendingLocation.label : "";
    const val = window.prompt("Location", current);
    if (val === null) return;
    const trimmed = val.trim();
    pendingLocation = trimmed ? { lat: null, lon: null, label: trimmed } : null;
    updateLocationLabel();
  }

  function updateLocationLabel(){
    const el = document.getElementById("locationLabel");
    if (el) el.textContent = pendingLocation && pendingLocation.label ? pendingLocation.label : "Add location";
  }

  function fileToResizedDataURL(file, maxDim, quality){
    maxDim = maxDim || 1000;
    quality = quality || 0.75;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let width = img.width, height = img.height;
          if (width > maxDim || height > maxDim){
            if (width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
            else { width = Math.round(width * maxDim / height); height = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  window.triggerPhotoUpload = function(target){
    photoUploadTarget = target;
    document.getElementById("photoFileInput").click();
  }

  window.handlePhotoFileInput = async function(e){
    const files = Array.from(e.target.files || []);
    const target = photoUploadTarget;
    e.target.value = "";
    if (!files.length) return;
    let dataUrls;
    try {
      dataUrls = await Promise.all(files.map(f => fileToResizedDataURL(f)));
    } catch(err){
      return;
    }
    if (target === "write"){
      pendingImages = pendingImages.concat(dataUrls);
      renderWritePhotoRow();
    } else if (target){
      const g = taskGroups.find(x => x.id === target);
      if (g){
        g.images = (g.images || []).concat(dataUrls);
        saveTasks();
        renderTaskDetail();
      }
    }
  }

  function renderWritePhotoRow(){
    const row = document.getElementById("writePhotoRow");
    if (!row) return;
    let html = pendingImages.map((src, i) => `
      <div class="thumb-sm">
        <img src="${src}">
        <button class="thumb-remove" onclick="removeWriteImage(${i})">×</button>
      </div>`).join("");
    html += `<button class="thumb-add" onclick="triggerPhotoUpload('write')">+</button>`;
    row.innerHTML = html;
  }

  window.removeWriteImage = function(i){
    pendingImages.splice(i, 1);
    renderWritePhotoRow();
  }

  window.openLightbox = function(imgEl){
    const overlay = document.createElement("div");
    overlay.className = "lightbox";
    const img = document.createElement("img");
    img.src = imgEl.src;
    overlay.appendChild(img);
    overlay.onclick = () => overlay.remove();
    document.body.appendChild(overlay);
  }

  function timeOnly(ts){
    return new Date(ts).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
  }

  function timeAgo(ts){
    const d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()){
      return d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
    }
    return d.toLocaleDateString(undefined, {month:"short", day:"numeric", year: d.getFullYear()!==now.getFullYear() ? "numeric": undefined});
  }

  function dateHeading(ts){
    const d = new Date(ts), now = new Date();
    const y = new Date(now); y.setDate(now.getDate()-1);
    if (d.toDateString() === now.toDateString()) return "Today";
    if (d.toDateString() === y.toDateString()) return "Yesterday";
    return d.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric", year: d.getFullYear()!==now.getFullYear() ? "numeric": undefined});
  }

  function truncate(s, n){
    if (!s) return "—";
    return s.length > n ? s.slice(0, n).trim() + "…" : s;
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function setupInfiniteScroll(totalCount){
    if (io) { io.disconnect(); io = null; }
    const sentinel = document.getElementById("scrollSentinel");
    if (!sentinel || visibleCount >= totalCount) return;
    io = new IntersectionObserver((es) => {
      if (es[0].isIntersecting){
        visibleCount = Math.min(visibleCount + PAGE_SIZE, totalCount);
        renderReflect();
      }
    }, { rootMargin: "200px" });
    io.observe(sentinel);
  }

  function renderReflect(){
    const body = document.getElementById("reflectBody");
    if (entries.length === 0){
      body.innerHTML = `<div class="empty"><div class="h">Nothing here yet</div><div class="p">Write something, then come back.</div></div>`;
      return;
    }

    const toggleHtml = `
      <div class="view-toggle">
        <button class="view-btn ${currentView==='timeline'?'active':''}" onclick="setView('timeline')">Timeline</button>
        <button class="view-btn ${currentView==='table'?'active':''}" onclick="setView('table')">Table</button>
      </div>`;

    const visible = entries.slice(0, visibleCount);
    let contentHtml = "";

    if (currentView === "timeline"){
      let lastKey = null;
      visible.forEach((e) => {
        const key = new Date(e.ts).toDateString();
        if (key !== lastKey){
          contentHtml += `<div class="date-heading">${dateHeading(e.ts)}</div>`;
          lastKey = key;
        }
        const meta = [timeOnly(e.ts)];
        if (e.location && e.location.label) meta.push(escapeHtml(e.location.label));
        if (e.images && e.images.length) meta.push("📷 " + e.images.length);
        contentHtml += `
          <div class="entry">
            <button class="entry-head" onclick="openEntry('${e.id}')">
              <div style="min-width:0; flex:1;">
                <div class="entry-date">${meta.join(' · ')}</div>
                <div class="entry-happened">${escapeHtml(e.happened)}</div>
              </div>
              <svg class="chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 6 15 12 9 18"/></svg>
            </button>
          </div>`;
      });
    } else {
      let rows = "";
      visible.forEach((e) => {
        rows += `
          <tr class="row-tap" onclick="openEntry('${e.id}')">
            <td>${timeAgo(e.ts)}</td>
            <td>${escapeHtml(truncate(e.location && e.location.label, 22))}</td>
            <td>${escapeHtml(truncate(e.happened, 50))}</td>
            <td>${escapeHtml(truncate(e.thought, 50))}</td>
            <td>${escapeHtml(truncate(e.feeling, 50))}</td>
          </tr>`;
      });
      contentHtml = `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Time</th><th>Place</th><th>Situation</th><th>Thought</th><th>Feeling</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    const moreHtml = visibleCount < entries.length
      ? `<div class="loading-more" id="scrollSentinel">Loading more…</div>`
      : "";

    body.innerHTML = toggleHtml + contentHtml + moreHtml;
    setupInfiniteScroll(entries.length);
  }

  window.setView = function(v){
    currentView = v;
    visibleCount = PAGE_SIZE;
    renderReflect();
  }

  function showScreen(id){
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    const hideTabbar = (id === "entryDetail" || id === "taskDetail");
    document.getElementById("tabbar").style.display = hideTabbar ? "none" : "flex";
  }

  window.openEntry = function(id){
    detailEntryId = id;
    renderEntryDetail();
    showScreen("entryDetail");
  }

  window.closeEntryDetail = function(){
    showScreen(currentTab);
  }

  function renderEntryDetail(){
    const e = entries.find(x => x.id === detailEntryId);
    const body = document.getElementById("entryDetailBody");
    if (!e){ body.innerHTML = ""; return; }
    const meta = [dateHeading(e.ts), timeOnly(e.ts)];
    if (e.location && e.location.label) meta.push(escapeHtml(e.location.label));
    const photosHtml = (e.images && e.images.length)
      ? `<div><div class="label">Photos</div><div class="photo-grid" style="margin-top:8px;">${
          e.images.map(src => `<div class="photo-tile"><img src="${src}" onclick="openLightbox(this)"></div>`).join("")
        }</div></div>`
      : "";
    body.innerHTML = `
      <div class="entry-date" style="margin-bottom:20px;">${meta.join(' · ')}</div>
      <div style="display:flex; flex-direction:column; gap:24px;">
        <div><div class="label">What happened</div><div class="detail-happened">${escapeHtml(e.happened)}</div></div>
        <div><div class="label">Thought</div><div class="val">${escapeHtml(e.thought)}</div></div>
        <div><div class="label">Feeling</div><div class="val">${escapeHtml(e.feeling)}</div></div>
        ${photosHtml}
      </div>`;
  }

  window.switchTab = function(tab){
    currentTab = tab;
    showScreen(tab);
    document.getElementById("tabWriteBtn").classList.toggle("active", tab === "write");
    document.getElementById("tabReflectBtn").classList.toggle("active", tab === "reflect");
    document.getElementById("tabTasksBtn").classList.toggle("active", tab === "tasks");
    if (tab === "reflect"){
      visibleCount = PAGE_SIZE;
      renderReflect();
    }
    if (tab === "tasks"){
      renderTasks();
    }
  }

  function renderDots(){
    document.getElementById("dots").innerHTML = STEPS.map((s,i) =>
      `<div class="dot ${i<=step?'on':''}"></div>`).join("");
  }

  function renderStep(fade){
    renderDots();
    const wrap = document.getElementById("stepWrap");
    const doRender = () => {
      const s = STEPS[step];
      document.getElementById("promptText").textContent = s.prompt;
      const field = document.getElementById("fieldInput");
      field.placeholder = s.placeholder;
      field.value = form[s.key] || "";
      updateNextBtn();
      if (fade) {
        wrap.style.opacity = 1;
        setTimeout(() => field.focus(), 100);
      }
    };
    if (fade){
      wrap.style.opacity = 0;
      setTimeout(doRender, 260);
    } else {
      doRender();
    }
  }

  function updateNextBtn(){
    const val = document.getElementById("fieldInput").value.trim();
    const btn = document.getElementById("nextBtn");
    const ready = val.length > 0;
    btn.classList.toggle("ready", ready);
    document.getElementById("nextLabel").textContent = step < STEPS.length - 1 ? "Continue" : "Save";
  }

  document.getElementById("fieldInput").addEventListener("input", updateNextBtn);

  window.stepNext = function(){
    const s = STEPS[step];
    const field = document.getElementById("fieldInput");
    const val = field.value.trim();
    if (!val) return;
    form[s.key] = field.value;
    if (step < STEPS.length - 1){
      step++;
      renderStep(true);
    } else {
      saveEntry(form);
    }
  }

  function saveEntry(f){
    const entry = { id: uid(), ts: Date.now(), location: pendingLocation, images: pendingImages, ...f };
    entries = [entry, ...entries];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    form = {};
    step = 0;
    renderStep(false);
    pendingImages = [];
    renderWritePhotoRow();
    visibleCount = PAGE_SIZE;
    switchTab("reflect");
  }

  // ---- Tasks ----

  function taskProgress(g){
    const total = g.tasks.length;
    const done = g.tasks.filter(t => t.done).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    return { total, done, pct };
  }

  function filterTaskGroups(groups){
    const today = todayStr();
    return groups.filter(g => {
      const { total, pct } = taskProgress(g);
      switch(taskFilter){
        case "today": return g.date === today;
        case "completed": return total > 0 && pct === 100;
        case "uncompleted": return !(total > 0 && pct === 100);
        case "started": return pct > 0 && pct < 100;
        case "notstarted": return pct === 0;
        default: return true;
      }
    });
  }

  function renderTaskCard(g){
    const { total, pct } = taskProgress(g);
    const subtasksHtml = g.tasks.map(t => `
      <label class="subtask-row" onclick="event.stopPropagation()">
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleSubtask('${g.id}','${t.id}')">
        <span class="${t.done ? 'subtask-done' : ''}">${escapeHtml(t.name)}</span>
      </label>`).join("");
    return `
      <div class="task-card" onclick="openTaskDetail('${g.id}')">
        <div class="task-card-head">
          <div class="task-heading">${escapeHtml(g.heading)}</div>
          <div class="task-pct">${total ? pct + '%' : '—'}</div>
        </div>
        ${total ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>` : ''}
        <div class="subtask-list">${subtasksHtml || '<div class="subtask-empty">No sub-tasks yet</div>'}</div>
      </div>`;
  }

  function renderTasks(){
    document.getElementById("taskFilterRow").innerHTML = TASK_FILTERS.map(f =>
      `<button class="filter-chip ${taskFilter===f.key?'active':''}" onclick="setTaskFilter('${f.key}')">${f.label}</button>`
    ).join("");

    const body = document.getElementById("tasksBody");
    if (taskGroups.length === 0){
      body.innerHTML = `<div class="empty"><div class="h">No tasks yet</div><div class="p">Tap "New task" to add your first checklist.</div></div>`;
      return;
    }
    const filtered = filterTaskGroups(taskGroups);
    if (filtered.length === 0){
      body.innerHTML = `<div class="empty"><div class="h">Nothing here</div><div class="p">No tasks match this filter.</div></div>`;
      return;
    }
    body.innerHTML = filtered.map(renderTaskCard).join("");
  }

  window.setTaskFilter = function(k){
    taskFilter = k;
    renderTasks();
  }

  window.addTaskGroup = function(){
    const name = window.prompt("Task heading");
    if (!name || !name.trim()) return;
    const g = { id: uid(), heading: name.trim(), date: todayStr(), description: "", images: [], tasks: [] };
    taskGroups = [g, ...taskGroups];
    saveTasks();
    renderTasks();
    openTaskDetail(g.id);
  }

  window.toggleSubtask = function(gid, tid){
    const g = taskGroups.find(x => x.id === gid);
    if (!g) return;
    const t = g.tasks.find(x => x.id === tid);
    if (!t) return;
    t.done = !t.done;
    saveTasks();
    renderTasks();
    if (detailTaskId === gid) renderTaskDetail();
  }

  window.openTaskDetail = function(id){
    detailTaskId = id;
    renderTaskDetail();
    showScreen("taskDetail");
  }

  window.closeTaskDetail = function(){
    showScreen("tasks");
    renderTasks();
  }

  window.renameTaskHeading = function(){
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    const val = window.prompt("Task heading", g.heading);
    if (val === null || !val.trim()) return;
    g.heading = val.trim();
    saveTasks();
    renderTaskDetail();
  }

  window.addSubtask = function(){
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    const val = window.prompt("Sub-task name");
    if (!val || !val.trim()) return;
    g.tasks.push({ id: uid(), name: val.trim(), done: false });
    saveTasks();
    renderTaskDetail();
  }

  window.renameSubtask = function(tid){
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    const t = g.tasks.find(x => x.id === tid);
    if (!t) return;
    const val = window.prompt("Sub-task name", t.name);
    if (val === null || !val.trim()) return;
    t.name = val.trim();
    saveTasks();
    renderTaskDetail();
  }

  window.toggleSubtaskDetail = function(tid){
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    const t = g.tasks.find(x => x.id === tid);
    if (!t) return;
    t.done = !t.done;
    saveTasks();
    renderTaskDetail();
  }

  window.deleteSubtask = function(tid){
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    g.tasks = g.tasks.filter(x => x.id !== tid);
    saveTasks();
    renderTaskDetail();
  }

  window.deleteTaskGroup = function(){
    if (!window.confirm("Delete this task and all its sub-tasks?")) return;
    taskGroups = taskGroups.filter(x => x.id !== detailTaskId);
    saveTasks();
    showScreen("tasks");
    renderTasks();
  }

  window.removeTaskImage = function(idx){
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    g.images.splice(idx, 1);
    saveTasks();
    renderTaskDetail();
  }

  function bindTaskDescInput(){
    const el = document.getElementById("taskDescInput");
    if (!el) return;
    el.addEventListener("input", () => {
      const g = taskGroups.find(x => x.id === detailTaskId);
      if (!g) return;
      g.description = el.value;
      saveTasks();
    });
  }

  function renderTaskDetail(){
    const g = taskGroups.find(x => x.id === detailTaskId);
    if (!g) return;
    document.getElementById("taskDetailHeading").textContent = g.heading;
    const { total, done, pct } = taskProgress(g);

    const subtasksHtml = g.tasks.map(t => `
      <div class="detail-subtask-row">
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleSubtaskDetail('${t.id}')">
        <div class="detail-subtask-name" onclick="renameSubtask('${t.id}')" style="${t.done ? 'text-decoration:line-through;color:var(--ink-soft);' : ''}">${escapeHtml(t.name)}</div>
        <button class="detail-subtask-del" onclick="deleteSubtask('${t.id}')">×</button>
      </div>`).join("");

    const imagesHtml = (g.images || []).map((src, i) => `
      <div class="photo-tile">
        <img src="${src}" onclick="openLightbox(this)">
        <button class="thumb-remove" onclick="removeTaskImage(${i})">×</button>
      </div>`).join("");

    const body = document.getElementById("taskDetailBody");
    body.innerHTML = `
      <div class="section-block">
        ${total ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>` : ''}
        <div class="label">${total ? `${done}/${total} done · ${pct}%` : 'No sub-tasks yet'}</div>
      </div>
      <div class="section-block">
        <div class="label">Sub-tasks</div>
        ${subtasksHtml}
        <button class="small-btn" onclick="addSubtask()">+ Add sub-task</button>
      </div>
      <div class="section-block">
        <div class="label">Description</div>
        <textarea class="desc-input" id="taskDescInput" placeholder="Add notes about this task…">${escapeHtml(g.description || "")}</textarea>
      </div>
      <div class="section-block">
        <div class="label">Photos</div>
        <div class="photo-grid" style="margin-top:8px;">
          ${imagesHtml}
          <button class="photo-add-tile" onclick="triggerPhotoUpload('${g.id}')">+</button>
        </div>
      </div>`;
    bindTaskDescInput();
  }

  seededBlobs();
  renderStep(false);
  updateLocationLabel();
  renderWritePhotoRow();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
